ithout surprises</h3><p>Trace the runtime lifecycle, persistence boundaries, security model, integrations, and verification commands.</p><a class=\"text-link\" href=\"#docs-technicalguide\">Open this guide</a></article>\n    <article class=\"path-card\"><span class=\"step\">05</span><p class=\"eyebrow\">Codebase</p><h3>Onboard at source level</h3><p>Map the modules, stack, conventions, testing patterns, and known concerns before opening a pull request.</p><a class=\"text-link\" href=\"#docs-codebase-architecture\">Open this guide</a></article>\n  </div>\n</section>\n\n<section class=\"section-block two-column\">\n  <div>\n    <p class=\"eyebrow\">Core idea</p><h2>Process once, reuse many ways</h2>\n    <p>Adversal performs the expensive remote video-understanding pass and returns\n    chaptered Markdown plus selected frames. The app keeps those artifacts as the\n    evidence layer. Qdrant retrieves relevant chunks for questions, while the selected\n    chat provider creates task-specific documents from bounded context.</p>\n    <p><a class=\"text-link\" href=\"#readme\">The README</a>, <a class=\"text-link\" href=\"#docs-explanation\">the explanation</a>, and\n    <a class=\"text-link\" href=\"#docs-technicalguide\">the technical guide</a> describe this boundary in more detail.</p>\n  </div>\n  <div class=\"fact-panel\">\n    <div><strong>9</strong><span>supported output workflows</span></div>\n    <div><strong>3</strong><span>source artifact downloads</span></div>\n    <div><strong>1</strong><span>reusable video workspace</span></div>\n  </div>\n</section>\n\n<section class=\"section-block\">\n  <div class=\"section-heading\"><p class=\"eyebrow\">Included in this site</p><h2>Every tracked Markdown page</h2></div>\n  <p class=\"muted\">This file is generated from the repository at build time. It embeds the current\n  Markdown, rewrites internal documentation links to local routes, and keeps external links visible.\n  The source inventory is: README.md, docs/ARCHITECTURE.md, docs/EXPLANATION.md, docs/HOW_TO.md, docs/REFERENCE.md, docs/TECHNICAL_GUIDE.md, docs/TUTORIAL.md, docs/USAGE.md, docs/codebase/ARCHITECTURE.md, docs/codebase/CONCERNS.md, docs/codebase/CONVENTIONS.md, docs/codebase/INTEGRATIONS.md, docs/codebase/STACK.md, docs/codebase/STRUCTURE.md, docs/codebase/TESTING.md.</p>\n  <div class=\"document-grid\">\n    <a class=\"document-card\" href=\"#readme\"><span>Start here</span><strong>Video Summarizer</strong><small>Project overview, workflows, setup, configuration, and limitations.</small></a><a class=\"document-card\" href=\"#docs-architecture\"><span>Operate</span><strong>Architecture documentation</strong><small>Architecture reading order and links to the project diagrams.</small></a><a class=\"document-card\" href=\"#docs-explanation\"><span>Understand</span><strong>Explanation: why the application is designed this way</strong><small>The design choices behind the process-once, artifact-first architecture.</small></a><a class=\"document-card\" href=\"#docs-howto\"><span>Do</span><strong>How-to guides</strong><small>Task-focused recipes for launching, operating, troubleshooting, and deploying.</small></a><a class=\"document-card\" href=\"#docs-reference\"><span>Understand</span><strong>Reference</strong><small>Exact runtime settings, contracts, paths, models, and limits.</small></a><a class=\"document-card\" href=\"#docs-technicalguide\"><span>Operate</span><strong>Video Summarizer technical guide</strong><small>Developer and operator guidance for the complete runtime lifecycle.</small></a><a class=\"document-card\" href=\"#docs-tutorial\"><span>Learn</span><strong>Tutorial: process your first video</strong><small>A guided first run from installation to a grounded answer and export.</small></a><a class=\"document-card\" href=\"#docs-usage\"><span>Documentation</span><strong>Using Video Summarizer</strong><small>Read Using Video Summarizer in the project documentation set.</small></a><a class=\"document-card\" href=\"#docs-codebase-architecture\"><span>Codebase</span><strong>Architecture</strong><small>Implementation layers, responsibilities, patterns, and risks.</small></a><a class=\"document-card\" href=\"#docs-codebase-concerns\"><span>Codebase</span><strong>Codebase Concerns</strong><small>Known concerns, boundaries, and maintenance risks.</small></a><a class=\"document-card\" href=\"#docs-codebase-conventions\"><span>Codebase</span><strong>Coding Conventions</strong><small>Coding, naming, testing, and documentation conventions.</small></a><a class=\"document-card\" href=\"#docs-codebase-integrations\"><span>Codebase</span><strong>External Integrations</strong><small>External services, SDKs, persistence, and integration boundaries.</small></a><a class=\"document-card\" href=\"#docs-codebase-stack\"><span>Codebase</span><strong>Technology Stack</strong><small>The runtime, dependency, deployment, and quality-tool stack.</small></a><a class=\"document-card\" href=\"#docs-codebase-structure\"><span>Codebase</span><strong>Codebase Structure</strong><small>A map of source files, tests, docs, and runtime data directories.</small></a><a class=\"document-card\" href=\"#docs-codebase-testing\"><span>Codebase</span><strong>Testing Patterns</strong><small>Existing verification patterns and the current testing gap analysis.</small></a>\n  </div>\n</section>\n\n<section class=\"section-block diagrams\">\n  <div><p class=\"eyebrow\">Visual orientation</p><h2>Read the architecture as a picture</h2>\n  <p>Open the diagram index for the system, processing sequence, job lifecycle, and private Space deployment views.</p></div>\n  <a class=\"diagram-link\" href=\"./diagrams/video-summarizer-architecture.html\">Open architecture diagram ↗</a>\n</section>\n"}, {"slug": "readme", "title": "Video Summarizer", "category": "Start here", "description": "Project overview, workflows, setup, configuration, and limitations.", "source": "README.md", "content": "<div align=\"center\">\n<h1 id=\"video-summarizer\">Video Summarizer</h1>\n<p>Process one video into structured notes, visual frames, answers with sources, and content you can reuse for learning or publishing.</p>\n<p><a href=\"https://github.com/pypi-ahmad/video-summarizer/actions/workflows/ci.yml\" target=\"<em>blank\" rel=\"noreferrer\"><img src=\"https://img.shields.io/github/actions/workflow/status/pypi-ahmad/video-summarizer/ci.yml?branch=main&amp;style=flat-square&amp;label=CI\" alt=\"CI\" loading=\"lazy\"></a> <a href=\"https://www.python.org/\" target=\"</em>blank\" rel=\"noreferrer\"><img src=\"https://img.shields.io/badge/Python-3.13%2B-3776AB?style=flat-square&amp;logo=python&amp;logoColor=white\" alt=\"Python 3.13+\" loading=\"lazy\"></a> <a href=\"https://streamlit.io/\" target=\"<em>blank\" rel=\"noreferrer\"><img src=\"https://img.shields.io/badge/Streamlit-1.62-FF4B4B?style=flat-square&amp;logo=streamlit&amp;logoColor=white\" alt=\"Streamlit\" loading=\"lazy\"></a> <a href=\"https://docs.astral.sh/uv/\" target=\"</em>blank\" rel=\"noreferrer\"><img src=\"https://img.shields.io/badge/managed%20with-uv-DE5FE9?style=flat-square\" alt=\"uv\" loading=\"lazy\"></a> <a href=\"../LICENSE\"><img src=\"https://img.shields.io/badge/License-MIT-yellow?style=flat-square\" alt=\"License: MIT\" loading=\"lazy\"></a></p>\n<p><a href=\"#getting-started\">Get started</a> · <a href=\"#what-you-can-create\">Workflows</a> · <a href=\"#powered-by-adversal-ai\">Adversal guide</a> · <a href=\"#architecture\">Architecture</a> · <a href=\"#documentation\">Documentation</a></p>\n</div>\n<p>Video Summarizer is a Streamlit workspace for one user, built around <a href=\"https://adversal.ai\" target=\"_blank\" rel=\"noreferrer\">Adversal</a>. Upload a video or provide a public URL once. Adversal returns chaptered Markdown and selected screenshots. The app reuses those files for semantic search, study material, operating documents, and publishable content without running another analysis on the video.</p>\n<aside class=\"callout important\"><p>Adversal is a remote video-understanding service exposed through a local <code>adversal-cli</code> MCP subprocess. Video analysis happens on Adversal&#x27;s infrastructure; this application stores the returned Markdown, frames, and request metadata locally.</p></aside>\n<h2 id=\"powered-by-adversal-ai\">Powered by Adversal AI</h2>\n<aside class=\"callout tip\"><p><strong><a href=\"https://adversal.ai/\" target=\"<em>blank\" rel=\"noreferrer\">Adversal AI</a> turns long videos into clean Markdown and useful visual frames for AI agents.</strong> Give it a local video or public URL, let the remote job run asynchronously, then reuse the result without placing the entire raw video in every model prompt. Adversal currently offers <strong>100 free processing minutes each month</strong>. <a href=\"https://adversal.ai/\" target=\"</em>blank\" rel=\"noreferrer\">Explore Adversal</a> · <a href=\"https://adversal.ai/documentation/mcp\" target=\"<em>blank\" rel=\"noreferrer\">Read the MCP guide</a> · <a href=\"https://adversal.ai/pricing\" target=\"</em>blank\" rel=\"noreferrer\">See pricing</a></p></aside>\n<p>Adversal is the video-understanding engine behind this application. It handles the multimodal source pass—speech, scenes, slides, diagrams, code, and other important visual context—and writes the result to a folder as structured notes plus selected images. Video Summarizer then adds a visual workspace, Qdrant retrieval, grounded Q&amp;A, task-specific documents, and portable downloads around those artifacts.</p>\n<p>This repository is an <strong>independent integration</strong>. It is not an official Adversal product and does not imply a partnership or endorsement. Adversal owns its service, accounts, published pricing, quotas, benchmark claims, and MCP CLI.</p>\n<h3 id=\"what-adversal-provides\">What Adversal provides</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Capability</th><th>What it gives you</th></tr></thead><tbody><tr><td><strong>Local files and public URLs</strong></td><td>Process an authorized video from disk or a URL supported by the remote downloader</td></tr><tr><td><strong>Structured Markdown</strong></td><td>Readable sections, summaries, timestamps, and notes instead of one unbounded transcript</td></tr><tr><td><strong>Key visual frames</strong></td><td>Selected screenshots that preserve useful slides, diagrams, code, and scenes</td></tr><tr><td><strong>Purpose-aware analysis</strong></td><td><code>generic</code>, <code>lesson</code>, <code>interview</code>, and <code>meeting</code> modes shape the notes for the source</td></tr><tr><td><strong>Adjustable image selection</strong></td><td><code>minimal</code>, <code>selective</code>, or <code>generous</code> controls how many representative images are extracted</td></tr><tr><td><strong>Clip and exact-frame controls</strong></td><td>Analyze a time range and optionally request frames at specific timestamps</td></tr><tr><td><strong>Asynchronous jobs</strong></td><td>Submit once, retain the request ID, and check status without holding one long client connection open</td></tr><tr><td><strong>Agent-ready interface</strong></td><td>Use the local MCP server from Claude Code, OpenCode, Cursor, or another stdio MCP client</td></tr><tr><td><strong>Browser-based sign-in</strong></td><td>Authenticate through OAuth; no Adversal API key is placed in an MCP configuration file</td></tr><tr><td><strong>Quota visibility</strong></td><td>Ask the MCP server for remaining monthly minutes and account-tier information</td></tr></tbody></table></div>\n<p>Adversal&#x27;s MCP server exposes four tools:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Tool</th><th>Purpose</th></tr></thead><tbody><tr><td><code>authenticate</code></td><td>Starts or refreshes the browser OAuth session</td></tr><tr><td><code>process_video</code></td><td>Submits a local file or public URL and returns a <code>request_id</code></td></tr><tr><td><code>check<em>video</em>status</code></td><td>Reports <code>RUNNING</code>, <code>COMPLETED</code>, <code>FAILED</code>, or <code>UNKNOWN</code> for that request</td></tr><tr><td><code>check<em>remaining</em>quota</code></td><td>Reports the remaining monthly allowance and tier details</td></tr></tbody></table></div>\n<p><code>process<em>video</code> requires exactly one of <code>video</em>path</code> or <code>video<em>url</code>, plus an <code>output</em>path</code>. It also accepts <code>file<em>name</code> (default <code>notes.md</code>), <code>type</code>, <code>images</code>, <code>start</em>time</code>, <code>end<em>time</code>, and a <code>timestamps</code> list. Time values can be seconds, <code>MM:SS</code>, or <code>HH:MM:SS</code>. Explicit timestamp frames are written below <code>&lt;output</em>path&gt;/requested_frames</code>.</p>\n<h3 id=\"install-and-connect-adversal-directly\">Install and connect Adversal directly</h3>\n<p>You can use Adversal without this Streamlit application. Its published prerequisites are Python 3.13 or newer and FFmpeg/FFprobe. Install FFmpeg for your platform, then install the MCP server:</p>\n<pre><code class=\"language-powershell\"># Windows\nwinget install ffmpeg\npython -m pip install adversal-cli</code></pre>\n<pre><code class=\"language-bash\"># macOS\nbrew install ffmpeg\npython -m pip install adversal-cli\n\n# Debian or Ubuntu\nsudo apt install ffmpeg\npython -m pip install adversal-cli</code></pre>\n<p><code>yt-dlp</code> is installed with <code>adversal-cli</code>. Add the server to a supported MCP client:</p>\n<pre><code class=\"language-bash\"># Claude Code\nclaude mcp add adversal -- adversal-cli</code></pre>\n<p>For OpenCode, add this to its configuration:</p>\n<pre><code class=\"language-json\">{\n  &quot;mcp&quot;: {\n    &quot;adversal&quot;: {\n      &quot;type&quot;: &quot;local&quot;,\n      &quot;command&quot;: [&quot;adversal-cli&quot;],\n      &quot;enabled&quot;: true,\n      &quot;timeout&quot;: 400000\n    }\n  }\n}</code></pre>\n<p>For Cursor, add this MCP server:</p>\n<pre><code class=\"language-json\">{\n  &quot;mcpServers&quot;: {\n    &quot;adversal&quot;: {\n      &quot;command&quot;: &quot;adversal-cli&quot;,\n      &quot;args&quot;: []\n    }\n  }\n}</code></pre>\n<p>Restart the client after changing its configuration. Ask the agent to process a video. If the tool reports <code>AUTHENTICATION REQUIRED</code>, call <code>authenticate</code>, complete the browser flow, and retry the original request without restarting the MCP server. The refresh session is stored at <code>~/.adversal/auth.txt</code>.</p>\n<p>A typical direct workflow is:</p>\n<ol><li>Ask <code>check<em>remaining</em>quota</code> how many minutes are available.</li><li>Call <code>process_video</code> with one authorized local path or public URL, an output folder, the most suitable analysis type, and the desired image density.</li><li>Save the returned <code>request_id</code>; do not submit the same video again while it runs.</li><li>Poll <code>check<em>video</em>status</code> until it reaches <code>COMPLETED</code> or <code>FAILED</code>. Request state survives MCP subprocess restarts.</li><li>Open the generated Markdown and images, or give that bounded evidence to another agent for searching, summarizing, or transformation.</li></ol>\n<h3 id=\"use-adversal-through-this-app\">Use Adversal through this app</h3>\n<p>Video Summarizer manages that MCP lifecycle for you:</p>\n<ol><li>Run this project and open the Streamlit page.</li><li>Upload an authorized video or paste a supported public URL.</li><li>Choose the analysis profile and visual-frame density.</li><li>Optionally expand <strong>Advanced processing controls</strong> to select a clip or exact frames.</li><li>Select <strong>Process video</strong> and complete Adversal authentication if prompted.</li><li>Watch the saved request while the app polls every eight seconds.</li><li>Inspect the source Markdown and frames, ask grounded questions, create reusable documents, or download native and OKF bundles.</li></ol>\n<p>The first five steps use Adversal. Search, Qdrant indexing, LLM-generated workflows, OKF export, ZIP packaging, persistence UI, and downloads are features added by this repository.</p>\n<h3 id=\"why-use-structured-video-understanding\">Why use structured video understanding</h3>\n<ul><li><strong>Smaller downstream prompts:</strong> agents can work from relevant chapters instead of repeatedly consuming an entire transcript or video.</li><li><strong>Visual context survives:</strong> screenshots keep information that speech-only transcription misses.</li><li><strong>One analysis, many outputs:</strong> the same evidence can support notes, search, meeting actions, SOPs, quizzes, FAQs, blog posts, and other workflows.</li><li><strong>Long jobs are resumable:</strong> request IDs and status checks fit agent workflows better than a single connection that must remain open for the whole analysis.</li><li><strong>Model-independent artifacts:</strong> Markdown and images are inspectable, portable, and usable by different agents and language models.</li><li><strong>Low-friction trial:</strong> the free Researcher tier needs no payment card and currently includes 100 minutes per month.</li></ul>\n<p>Common uses include lecture and course notes, meeting or webinar summaries, interview analysis, searchable video libraries, content triage, help-center material, SOPs with screenshots, and repurposing recorded material into publishable content.</p>\n<h3 id=\"published-pricing-and-benchmark-results\">Published pricing and benchmark results</h3>\n<p>Adversal publishes these monthly plans as of <strong>August 23, 2026</strong>:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Plan</th><th>Published price</th><th>Included processing</th></tr></thead><tbody><tr><td>Researcher</td><td>Free, no card required</td><td>100 minutes/month</td></tr><tr><td>Lite</td><td>$10/month</td><td>1,000 minutes/month</td></tr><tr><td>Pro</td><td>$20/month</td><td>2,500 minutes/month</td></tr><tr><td>Ultra</td><td>$50/month</td><td>6,000 minutes/month</td></tr><tr><td>Enterprise</td><td>Custom</td><td>Custom</td></tr></tbody></table></div>\n<p>Its pricing page also publishes an effective comparison of <strong>$0.008/minute</strong> for Adversal, versus $0.031 for Gemini 3.1 Pro Preview, $0.040 for GPT-5.6 Sol, and $0.042 for Claude Opus 5—described by Adversal as up to <strong>5.3× lower cost</strong>. These are vendor figures, not an independent cost study; workloads and comparison assumptions can change the real result.</p>\n<p>Adversal also publishes these <a href=\"https://longshot.cvmbzuai.com/leaderboard\" target=\"_blank\" rel=\"noreferrer\">LongShOTBench</a> results: Gemma 3 27B at 41.5%, Gemini 3.1 Pro at 55.6%, and Gemma 3 27B with Adversal at 72.1%. Treat them as vendor-reported benchmark results and review the benchmark method before using them for a purchasing decision.</p>\n<p>Pricing, quotas, supported clients, model comparisons, and benchmark results can change. Check <a href=\"https://adversal.ai/pricing\" target=\"<em>blank\" rel=\"noreferrer\">Adversal&#x27;s current pricing</a> and <a href=\"https://adversal.ai/documentation/mcp\" target=\"</em>blank\" rel=\"noreferrer\">official MCP documentation</a> before deployment. Only process videos you are authorized to send to a remote service; review Adversal&#x27;s current privacy and service terms for your data-handling requirements.</p>\n<h2 id=\"why-this-project-exists\">Why this project exists</h2>\n<p>Long videos are difficult inputs for language models. Full transcripts consume large context windows, while transcript-only pipelines miss slides, diagrams, code, and other useful scenes. This project keeps the expensive video pass separate from later reuse:</p>\n<ol><li>Adversal extracts structured chapters and representative visual frames.</li><li>The app keeps those artifacts as the source you can inspect.</li><li>An explicit visual-index step describes the safe frames with the selected model.</li><li>Qdrant retrieves relevant chapters and frame descriptions for each task.</li><li>The selected model receives both that context and the retrieved frame pixels.</li></ol>\n<p>This gives each video one durable workspace instead of a separate pipeline for every output.</p>\n<h2 id=\"what-you-can-create\">What you can create</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Workflow</th><th>Output</th></tr></thead><tbody><tr><td><strong>Study notes</strong></td><td>Original chaptered Markdown with timestamps and referenced screenshots</td></tr><tr><td><strong>Meeting/webinar summary</strong></td><td>Two compact bullet sections: Decisions and Action Items, including owners when identified</td></tr><tr><td><strong>Searchable knowledge base</strong></td><td>Grounded answers from five text chunks and up to three relevant frames, with citations and visible sources</td></tr><tr><td><strong>Content triage</strong></td><td>Three to five summary bullets plus a watch-in-full, skim, or skip recommendation with a reason</td></tr><tr><td><strong>Blog post</strong></td><td>Title, opening hook, preserved chapter body and screenshots, and conclusion</td></tr><tr><td><strong>Quiz and flashcards</strong></td><td>Six multiple-choice questions, four short-answer questions, an explained answer key, and fifteen flashcards</td></tr><tr><td><strong>SOP/how-to guide</strong></td><td>Purpose, prerequisites, numbered procedure, cautions, verification, troubleshooting, and supported screenshots</td></tr><tr><td><strong>Interview insight pack</strong></td><td>Executive summary, themes, Q&amp;A insights, paraphrased statements, and follow-up questions</td></tr><tr><td><strong>FAQ/help-center article</strong></td><td>Title, overview, organized FAQs, supported troubleshooting, related topics, and useful screenshots</td></tr></tbody></table></div>\n<h2 id=\"feature-guide\">Feature guide</h2>\n<h3 id=\"video-input-and-source-analysis\">Video input and source analysis</h3>\n<p>The submission form accepts one source at a time:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Feature</th><th>Behavior</th></tr></thead><tbody><tr><td><strong>Local upload</strong></td><td>Accepts <code>.mp4</code>, <code>.mov</code>, <code>.mkv</code>, and <code>.webm</code>; stores the file inside a unique UUID-bearing job directory</td></tr><tr><td><strong>Public URL</strong></td><td>Passes the URL to Adversal&#x27;s remote downloader; the app does not download it itself</td></tr><tr><td><strong>Analysis profile</strong></td><td>Generic, Lesson/tutorial, Interview, or Meeting/webinar changes how Adversal structures the source analysis</td></tr><tr><td><strong>Visual-frame density</strong></td><td>Minimal, Selective, or Generous controls how many representative frames Adversal returns</td></tr><tr><td><strong>Focused time range</strong></td><td>Optional start and end values accept seconds, <code>MM:SS</code>, or <code>HH:MM:SS</code></td></tr><tr><td><strong>Exact frames</strong></td><td>Optional comma- or line-separated timestamps request specific local screenshots</td></tr><tr><td><strong>Process-once model</strong></td><td>The selected profile, density, and focused controls apply once; all later views reuse the completed Markdown and images</td></tr><tr><td><strong>Non-blocking progress</strong></td><td>A Streamlit fragment polls Adversal every eight seconds while the rest of the application remains responsive</td></tr></tbody></table></div>\n<p>Uploaded filenames are reduced to a safe basename and verified to remain inside their job directory. URL access, authentication, and download duration still depend on the source host and Adversal.</p>\n<h3 id=\"notes-and-visual-evidence\">Notes and visual evidence</h3>\n<p>The completed Adversal result appears directly before any LLM summary:</p>\n<ul><li><strong>Notes</strong> renders the original chaptered Markdown and its local image references.</li><li><strong>Metrics</strong> show section count, safe referenced-frame count, and analysis profile.</li><li><strong>Key frames</strong> presents screenshots in a three-column gallery, twelve per page, with captions taken from Markdown alt text or filenames, plus safely contained exact frames requested during submission.</li><li><strong>Path containment</strong> rejects Markdown images outside the owning job directory before they can be displayed or archived.</li><li><strong>Missing-artifact handling</strong> reports when Adversal marked a job complete but <code>notes.md</code> is absent, or when no safe referenced frames were returned.</li></ul>\n<h3 id=\"searchable-video-knowledge-base\">Searchable video knowledge base</h3>\n<p>The <strong>Ask</strong> view turns completed notes and frames into persistent multimodal video RAG:</p>\n<ol><li>Notes are split along Adversal chapter separators and headings into chunks targeting at most 1,500 characters.</li><li><strong>Build visual index</strong> explicitly asks the selected backend to describe every safe Adversal key/requested frame. Each successful description is saved immediately in <code>visual-evidence.json</code>, so interrupted work can resume.</li><li>OpenAI <code>text-embedding-3-small</code> embeds text chunks and frame descriptions into the same collection; Qdrant labels each point as <code>text</code> or <code>frame</code>.</li><li>Each question retrieves five text chunks and up to three frames for the current video.</li><li>The selected model receives the retrieved text, descriptions, and actual frame pixels.</li></ol>\n<p>Answers include an expandable <strong>Sources</strong> list with text citations and retrieved frame thumbnails, captions, timestamps, and scores. Text-only Ask remains available if no visual index exists or the selected provider rejects image input. Turn off <strong>Use visual evidence in Ask and Create</strong> at any time to keep the persisted captions while running the current task from text only.</p>\n<aside class=\"callout note\"><p>Ask always requires <code>OPENAI<em>API</em>KEY</code> for embeddings. Agnes or Gemini may answer the final question, but they do not replace the fixed OpenAI embedding model.</p></aside>\n<h3 id=\"generated-documents\">Generated documents</h3>\n<p>The <strong>Create</strong> view offers seven grounded transformations listed in <a href=\"#what-you-can-create\">What you can create</a>. Every generated document:</p>\n<ul><li>uses the completed Adversal notes and up to four retrieved frame pixels when a visual index is available;</li><li>exposes the source notes in an expander for verification;</li><li>renders supported local screenshots where the workflow preserves image references;</li><li>downloads as a workflow-specific Markdown file; and</li><li>starts only after an explicit <strong>Generate</strong> click; and</li><li>is cached by <code>(request<em>id, selected</em>backend, visual<em>evidence</em>hash)</code> so reruns do not repeat paid calls or reuse stale visual context.</li></ul>\n<p>Notes up to 50,000 characters are sent to final generation directly. Longer notes are condensed in batches of at most 30,000 characters until they fit. Blog, SOP, and FAQ workflows explicitly preserve supported Markdown image references during reduction. Changing the backend creates a separate cached version without processing the video again.</p>\n<h3 id=\"downloads-and-agent-ready-exports\">Downloads and agent-ready exports</h3>\n<p>The <strong>Notes</strong> view provides three source-artifact formats:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Download</th><th>Contents</th><th>Best for</th></tr></thead><tbody><tr><td><strong>Markdown</strong></td><td>Adversal&#x27;s completed <code>notes.md</code></td><td>Reading, editing, or passing text to another tool</td></tr><tr><td><strong>Native bundle</strong></td><td>Source Markdown plus only its safely resolved referenced images</td><td>Moving the original Adversal result as one ZIP</td></tr><tr><td><strong>OKF 0.2 bundle</strong></td><td><code>index.md</code>, <code>video.md</code>, chapter concepts, and image assets</td><td>Ingestion by agents or knowledge-catalog workflows</td></tr><tr><td><strong>Download all</strong></td><td>The three source downloads plus Create documents already cached for the active video and backend</td><td>Collecting available outputs without new LLM calls</td></tr></tbody></table></div>\n<p>Every filename starts with a safe form of the original video stem, such as <code>My<em>Lecture</em>notes.md</code>, <code>My<em>Lecture</em>blog<em>post.md</code>, or <code>My</em>Lecture<em>all</em>downloads.zip</code>. Generated Create outputs retain their own <strong>Download as Markdown</strong> action. Download all does not generate missing documents; it includes only the versions already cached for the selected backend. Exports exclude the uploaded video, Qdrant data, job history, and unreferenced files.</p>\n<h3 id=\"provider-selection\">Provider selection</h3>\n<p>The <strong>LLM backend</strong> sidebar control switches chat and document generation without code changes:</p>\n<ul><li>OpenAI <code>gpt-5.6-luna</code> with medium reasoning effort;</li><li>Agnes AI <code>agnes-2.5-flash</code>;</li><li>Google <code>gemini-3.5-flash-lite</code> with medium thinking; or</li><li>Google <code>gemini-3.7-flash</code> with medium thinking.</li></ul>\n<p>Provider credentials come from environment variables or an optional gitignored <code>.env</code>. Existing environment values win. There is no automatic provider fallback, so a missing key or provider failure stays visible. The app does not silently change models.</p>\n<h3 id=\"authentication-and-quota\">Authentication and quota</h3>\n<p>Adversal uses browser OAuth, not an application API key. When an Adversal tool returns <code>AUTHENTICATION REQUIRED</code>, the app pauses and shows an <strong>Authenticate</strong> action:</p>\n<ul><li>locally, the browser flow opens on the computer running Streamlit;</li><li>in a private Hugging Face Space, the app instructs the user to open the temporary URL printed in runtime logs; and</li><li>the persisted Adversal directory lets later application processes reuse the authenticated session.</li></ul>\n<p>The banner clears only after Adversal returns <code>AUTHENTICATED</code>. An expired browser flow or <code>AUTHENTICATION FAILED</code> response remains visible as an error instead of being treated as a successful login.</p>\n<p>The sidebar <strong>Quota</strong> panel calls Adversal&#x27;s <code>check<em>remaining</em>quota</code> tool and displays the current response without starting video processing.</p>\n<h3 id=\"resumable-jobs-and-workspace-controls\">Resumable jobs and workspace controls</h3>\n<p>Each successful submission is stored in <code>runs/jobs.json</code> with its request ID, status, source, profile, density, optional time range and frame timestamps, and output directory. Writes use a process-local lock and atomic replacement.</p>\n<ul><li><strong>Resume a previous job</strong> lists the ten newest records with source, status, and request prefix.</li><li><strong>Retry status check</strong> turns a failed or unknown saved job back into <code>RUNNING</code> and polls its existing Adversal request ID; it never uploads or submits the video again.</li><li><strong>Process another video</strong> leaves a completed workspace without deleting it.</li><li><strong>Start over</strong> leaves a failed workspace while retaining its persisted record.</li><li><strong>Danger zone → Clear all runs</strong> closes the embedded Qdrant client and permanently deletes uploads, jobs, notes, frames, and vectors after explicit confirmation.</li></ul>\n<p>Generated documents and Ask chat history stay in the session instead of being persisted. Source artifacts, jobs, and vectors are durable.</p>\n<h3 id=\"logging-and-diagnostics\">Logging and diagnostics</h3>\n<p>Application progress appears in the <code>launch.cmd</code> terminal and in <code>logs/video-summarizer.log</code>. Logging is safe across Streamlit reruns, rotates at 5 MiB, and retains three backups. <code>VIDEO<em>SUMMARIZER</em>LOG_LEVEL</code> selects <code>DEBUG</code>, <code>INFO</code>, <code>WARNING</code>, <code>ERROR</code>, or <code>CRITICAL</code>.</p>\n<p>Events contain operational metadata such as components, request IDs, models, counts, durations, statuses, and error types. The application deliberately omits filenames, URLs, prompts, transcripts, generated content, and exception messages; configured keys and common token formats are redacted.</p>\n<h3 id=\"local-and-private-hosted-operation\">Local and private hosted operation</h3>\n<ul><li><strong>Windows launcher:</strong> installs uv when needed, pins Python 3.13.13, creates <code>.venv</code>, performs a locked sync, creates <code>.env</code> when missing, checks FFmpeg, and starts the app.</li><li><strong>Manual uv workflow:</strong> supports developers who manage the environment directly.</li><li><strong>Docker image:</strong> packages Python, uv, FFmpeg, the app, and <code>adversal-cli</code> for port 7860.</li><li><strong>Persistent Space storage:</strong> maps <code>/data/runs</code>, <code>/data/adversal</code>, and <code>/data/logs</code> so application data and OAuth state survive container restarts.</li><li><strong>Private single-user boundary:</strong> public/shared hosting is intentionally unsupported because users would share identity, files, vectors, history, and deletion controls.</li></ul>\n<h2 id=\"architecture\">Architecture</h2>\n<p><a href=\"./diagrams/video-summarizer-architecture.html\"><img src=\"./diagrams/system-architecture.svg\" alt=\"Video Summarizer system architecture\" loading=\"lazy\"></a></p>\n<p>The Streamlit process lazily opens one <code>adversal-cli</code> MCP subprocess. A daemon worker thread owns its asynchronous MCP context, while a thread-safe queue serializes submission, status, quota, and authentication calls onto that session. This keeps Adversal&#x27;s background extraction task alive across Streamlit reruns. Transport failures discard the broken session so the next action can create a fresh one; they do not automatically resubmit a video. After a real application restart, Adversal&#x27;s local registry recovers earlier request IDs. Completed artifacts feed four workspace views:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>View</th><th>Responsibility</th></tr></thead><tbody><tr><td><strong>Notes</strong></td><td>Inspect source Markdown and download Markdown, native, or OKF bundles</td></tr><tr><td><strong>Key frames</strong></td><td>Browse safe, locally referenced and explicitly requested images</td></tr><tr><td><strong>Ask</strong></td><td>Index, retrieve, answer, and expose supporting chapters</td></tr><tr><td><strong>Create</strong></td><td>Generate one of seven cached Markdown documents</td></tr></tbody></table></div>\n<p>More diagrams: <a href=\"./diagrams/video-processing-sequence.svg\">processing sequence</a> · <a href=\"./diagrams/job-lifecycle.svg\">job lifecycle</a> · <a href=\"./diagrams/private-space-deployment.html\">private Space deployment</a></p>\n<h2 id=\"getting-started\">Getting started</h2>\n<h3 id=\"prerequisites\">Prerequisites</h3>\n<ul><li>Windows 11 for the one-command launcher, or any environment capable of running the manual uv workflow</li><li><code>ffmpeg</code> and <code>ffprobe</code> on <code>PATH</code></li><li>An <a href=\"https://adversal.ai\" target=\"_blank\" rel=\"noreferrer\">Adversal</a> account</li><li>A provider key only for the LLM-backed features you plan to use</li></ul>\n<p>Notes, frames, and artifact downloads do not require an LLM key. <strong>Ask always requires <code>OPENAI<em>API</em>KEY</code></strong> because embeddings use OpenAI regardless of the selected chat model.</p>\n<h3 id=\"windows-quick-start\">Windows quick start</h3>\n<p>From the repository root:</p>\n<pre><code class=\"language-bat\">launch.cmd</code></pre>\n<p>On its first run, the launcher:</p>\n<ol><li>installs uv for the current Windows user when missing;</li><li>installs Python 3.13.13;</li><li>creates <code>.venv</code> in the project root;</li><li>synchronizes the locked production and development dependencies;</li><li>creates <code>.env</code> from <code>.env.example</code> when needed; and</li><li>starts Streamlit with live logs in the same terminal.</li></ol>\n<p>Open the URL printed by Streamlit, normally &lt;http://localhost:8501&gt;. The first Adversal operation may request browser authentication.</p>\n<h3 id=\"manual-uv-setup\">Manual uv setup</h3>\n<pre><code class=\"language-bash\">uv python pin 3.13.13\nuv sync --locked --all-groups\ncp .env.example .env   # optional when keys already exist in the environment\nuv run streamlit run app.py</code></pre>\n<p>On PowerShell, replace the copy command with:</p>\n<pre><code class=\"language-powershell\">Copy-Item .env.example .env</code></pre>\n<h2 id=\"configuration\">Configuration</h2>\n<p>The app reads credentials from the process environment. A local <code>.env</code> is an optional fallback and never overrides existing environment variables.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Variable</th><th>Used for</th><th>Required?</th></tr></thead><tbody><tr><td><code>OPENAI<em>API</em>KEY</code></td><td>OpenAI chat and all Ask embeddings</td><td>For OpenAI or Ask</td></tr><tr><td><code>OPENAI<em>BASE</em>URL</code></td><td>Optional OpenAI-compatible gateway</td><td>No</td></tr><tr><td><code>AGNES<em>API</em>KEY</code></td><td>Agnes AI chat</td><td>For Agnes</td></tr><tr><td><code>GOOGLE<em>API</em>KEY</code></td><td>Gemini chat</td><td>For Gemini</td></tr><tr><td><code>VIDEO<em>SUMMARIZER</em>LOG_LEVEL</code></td><td><code>DEBUG</code>, <code>INFO</code>, <code>WARNING</code>, <code>ERROR</code>, or <code>CRITICAL</code></td><td>No; defaults to <code>INFO</code></td></tr><tr><td><code>VIDEO<em>SUMMARIZER</em>DATA_DIR</code></td><td>Persistent container-data root</td><td>No; container defaults to <code>/data</code></td></tr></tbody></table></div>\n<p>Configured model choices:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Provider</th><th>Model</th><th>Reasoning setting</th></tr></thead><tbody><tr><td>OpenAI</td><td><code>gpt-5.6-luna</code></td><td>medium reasoning effort</td></tr><tr><td>Agnes AI</td><td><code>agnes-2.5-flash</code></td><td>provider default</td></tr><tr><td>Google</td><td><code>gemini-3.5-flash-lite</code></td><td>medium thinking</td></tr><tr><td>Google</td><td><code>gemini-3.7-flash</code></td><td>medium thinking</td></tr></tbody></table></div>\n<aside class=\"callout caution\"><p>Never commit <code>.env</code>, paste secret values into issues, or store provider keys as non-secret Hugging Face variables.</p></aside>\n<h2 id=\"using-the-app\">Using the app</h2>\n<ol><li>Select <strong>Upload file</strong> or <strong>Public URL</strong>.</li><li>Choose the video type: Generic, Lesson/tutorial, Interview, or Meeting/webinar.</li><li>Choose Minimal, Selective, or Generous key-frame extraction.</li><li>Optionally set a clip range or exact frame timestamps under advanced controls.</li><li>Select <strong>Process video</strong> and let the status panel poll Adversal.</li><li>Review <strong>Notes</strong> and <strong>Key frames</strong> before relying on generated material.</li><li>Use <strong>Ask</strong> for grounded questions or <strong>Create</strong> for a reusable document.</li></ol>\n<p>The sidebar can check Adversal quota, resume one of the ten newest persisted jobs, switch the generation backend, or permanently clear all run data.</p>\n<aside class=\"callout tip\"><p>If Adversal cannot download a long or protected URL, upload an authorized local file. Remote URL ingestion is limited by the source host and Adversal&#x27;s download timeout.</p></aside>\n<h2 id=\"data-and-persistence\">Data and persistence</h2>\n<pre><code class=\"language-text\">runs/\n├── jobs.json\n├── qdrant/\n└── &lt;timestamp&gt;_&lt;uuid&gt;_&lt;video-slug&gt;/\n    ├── &lt;uploaded-video&gt;\n    ├── notes.md\n    └── &lt;referenced frames&gt;</code></pre>\n<p>Generated documents and Ask chat history live in Streamlit session state. Jobs, source artifacts, and vectors persist on disk. Run data is not encrypted and has no automatic retention period; use <strong>Danger zone → Clear all runs</strong> when it is no longer needed.</p>\n<h2 id=\"private-hugging-face-deployment\">Private Hugging Face deployment</h2>\n<p>The repository includes a Docker image and entrypoint for a <strong>private, single-user</strong> Hugging Face Space. A private bucket is mounted at <code>/data</code> so these survive restarts:</p>\n<ul><li><code>/data/runs</code>: uploaded videos, jobs, Markdown, frames, and Qdrant data;</li><li><code>/data/adversal</code>: Adversal OAuth state and local request registry; and</li><li><code>/data/logs</code>: rotating application logs.</li></ul>\n<p>Creating a Docker Space requires a paid Hugging Face plan. See the <a href=\"#docs-howto/deploy-to-hugging-face-spaces\">deployment procedure</a> for the checked-in target configuration.</p>\n<aside class=\"callout warning\"><p>Do not deploy this application publicly or for several users. Visitors would share one Adversal identity, job history, Qdrant index, uploaded data, and destructive controls.</p></aside>\n<h2 id=\"technology-stack\">Technology stack</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Area</th><th>Technology</th></tr></thead><tbody><tr><td>UI and session orchestration</td><td>Streamlit</td></tr><tr><td>Runtime and dependency management</td><td>Python 3.13.13 and uv</td></tr><tr><td>Video understanding</td><td>Adversal through MCP stdio</td></tr><tr><td>Retrieval</td><td>Qdrant Client with OpenAI embeddings</td></tr><tr><td>Text generation</td><td>OpenAI, Agnes AI, and Google Gemini</td></tr><tr><td>Media inspection</td><td>FFmpeg and ffprobe</td></tr><tr><td>Quality</td><td>Ruff, ty, pytest, and GitHub Actions</td></tr><tr><td>Hosted packaging</td><td>Docker and Hugging Face Spaces</td></tr></tbody></table></div>\n<h2 id=\"project-structure\">Project structure</h2>\n<pre><code class=\"language-text\">video-summarizer/\n├── app.py                    # Streamlit entry point and workspace routing\n├── pipeline.py               # Job persistence, polling, and artifact rendering\n├── adversal_client.py        # MCP adapter for adversal-cli\n├── artifacts.py              # Safe frame discovery and ZIP/OKF exports\n├── modes.py                  # Search and seven generated-document workflows\n├── visual_evidence.py        # Safe, resumable frame-caption manifest\n├── vector_store.py           # Persistent text/frame Qdrant retrieval\n├── llm.py                    # Multimodal provider dispatch and OpenAI embeddings\n├── observability.py          # Terminal/file logging and secret redaction\n├── launch.cmd                # Canonical Windows bootstrap and launcher\n├── Dockerfile                # Private Hugging Face runtime image\n├── container-entrypoint.sh   # Persistent /data path mapping\n├── tests/                    # Regression and observability tests\n└── docs/                     # User, operator, architecture, and codebase guides</code></pre>\n<h2 id=\"development\">Development</h2>\n<p>Install the locked environment and run the same quality gates used by CI:</p>\n<pre><code class=\"language-bash\">uv sync --locked --all-groups\nuv run ruff check .\nuv run ty check\nuv run pytest -q</code></pre>\n<p>The current suite covers Adversal response contracts and connection reuse, focused-job compatibility, filesystem containment, export safety, provider contracts, cache behavior, long-note reduction, Qdrant filtering and idempotency, concurrent job persistence, and logging redaction/rotation. It currently contains 34 focused tests. External Adversal and model services are not called during tests.</p>\n<p>For module ownership and safe change paths, read the <a href=\"#docs-technicalguide\">developer/operator technical guide</a>.</p>\n<h2 id=\"current-limitations\">Current limitations</h2>\n<ul><li>One video workspace is active per browser session.</li><li>Generated documents and chat history stay in the session and are not persisted.</li><li>Embedded Qdrant and <code>jobs.json</code> locking support one server process only.</li><li>Public video URLs do not have an application-level host or private-network policy.</li><li>Adversal and model calls have no automatic retry, timeout, or circuit breaker; failed Adversal jobs can manually retry the existing status request.</li><li>There is no automatic provider fallback, retention cleanup, or application-level encryption.</li><li>Model output and retrieval similarity require human verification for consequential use.</li></ul>\n<h2 id=\"documentation\">Documentation</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Need</th><th>Start here</th></tr></thead><tbody><tr><td>Complete a first run</td><td><a href=\"#docs-tutorial\">Tutorial</a></td></tr><tr><td>Perform a specific task or troubleshoot</td><td><a href=\"#docs-howto\">How-to guides</a></td></tr><tr><td>Look up exact inputs, models, paths, and contracts</td><td><a href=\"#docs-reference\">Reference</a></td></tr><tr><td>Understand design decisions</td><td><a href=\"#docs-explanation\">Explanation</a></td></tr><tr><td>Develop or operate the system</td><td><a href=\"#docs-technicalguide\">Technical guide</a></td></tr><tr><td>Browse architecture diagrams</td><td><a href=\"#docs-architecture\">Architecture index</a></td></tr><tr><td>Onboard into the codebase</td><td><a href=\"#docs-codebase-architecture\">Codebase documentation</a></td></tr><tr><td>Browse every page offline</td><td><a href=\"./site.html\">Interactive HTML docs</a></td></tr></tbody></table></div>\n<p>The <a href=\"./site.html\">interactive HTML docs</a> are a self-contained, hash-routed site with a zero-to-mastery learning path. Rebuild it after Markdown changes with:</p>\n<pre><code class=\"language-bash\">uv run python scripts/build_docs_site.py</code></pre>\n<p>Use <code>uv run python scripts/build<em>docs</em>site.py --check</code> to verify that the checked-in HTML is synchronized with the tracked Markdown files.</p>\n<h2 id=\"getting-help\">Getting help</h2>\n<p>Check <a href=\"#docs-howto/recover-from-common-failures\">Recover from common failures</a> and the terminal or <code>logs/video-summarizer.log</code> first. If the problem is reproducible and project-specific, <a href=\"https://github.com/pypi-ahmad/video-summarizer/issues\" target=\"_blank\" rel=\"noreferrer\">open a GitHub issue</a> with the failing operation, sanitized log metadata, and your platform details. Never include API keys, video contents, transcripts, URLs, or OAuth tokens.</p>\n<hr>\n<p align=\"center\">Built by Ahmad Mujtaba</p>"}, {"slug": "docs-architecture", "title": "Architecture documentation", "category": "Operate", "description": "Architecture reading order and links to the project diagrams.", "source": "docs/ARCHITECTURE.md", "content": "<h1 id=\"architecture-documentation\">Architecture documentation</h1>\n<p>Architecture material is organized by reader intent:</p>\n<ul><li><a href=\"#docs-explanation\">Explanation</a> discusses why the application uses a process-once workspace, artifact-first and aggregate downloads, resumable visual captions, multimodal Qdrant retrieval, two persistence lifetimes, and a trusted single-process deployment model for local and private Docker execution.</li><li><a href=\"#docs-reference\">Reference</a> records exact runtime contracts, model settings, Qdrant behavior, storage paths, commands, and limits.</li><li><a href=\"#docs-codebase-architecture\">Codebase architecture</a> maps the implementation layers, module responsibilities, persistent MCP worker/session, failure recovery, patterns, and maintenance risks.</li><li><a href=\"#docs-technicalguide\">Technical guide</a> provides the developer/operator view of runtime contracts, export composition, persistence, integrations, security, deployment, and change paths.</li></ul>\n<p>The current system diagram is available as <a href=\"./diagrams/video-summarizer-architecture.html\">HTML</a>, <a href=\"./diagrams/video-summarizer-architecture.svg\">SVG</a>, or <a href=\"./diagrams/video-summarizer-architecture.png\">PNG</a>.</p>\n<p>For a guided, searchable view of this documentation set, open the <a href=\"./site.html\">offline HTML documentation site</a>.</p>\n<p>Focused diagrams:</p>\n<ul><li><a href=\"./diagrams/system-architecture.svg\">System architecture</a> shows the complete process-once and reuse path (<a href=\"./diagrams/system-architecture.mmd\">Mermaid source</a>).</li><li><a href=\"./diagrams/video-processing-sequence.svg\">Video-processing sequence</a> traces submission, persistent-session polling, and authentication (<a href=\"./diagrams/video-processing-sequence.mmd\">Mermaid source</a>).</li><li><a href=\"./diagrams/job-lifecycle.svg\">Job lifecycle</a> shows terminal states and retrying the same request ID (<a href=\"./diagrams/job-lifecycle.mmd\">Mermaid source</a>).</li><li><a href=\"./diagrams/private-space-deployment.html\">Private Hugging Face deployment</a></li></ul>"}, {"slug": "docs-explanation", "title": "Explanation: why the application is designed this way", "category": "Understand", "description": "The design choices behind the process-once, artifact-first architecture.", "source": "docs/EXPLANATION.md", "content": "<h1 id=\"explanation-why-the-application-is-designed-this-way\">Explanation: why the application is designed this way</h1>\n<p>Video Summarizer separates video analysis from the work that follows. This page explains the design decisions behind that boundary and the tradeoffs they create.</p>\n<h2 id=\"process-once-use-many-ways\">Process once, use many ways</h2>\n<p>Adversal performs the costly multimodal work: it reads the video&#x27;s audio and visual tracks, creates structured Markdown, and selects important frames. Meeting summaries, quizzes, FAQs, and other outputs are different presentations of that same evidence; they do not need another pass over the raw video.</p>\n<p>The app therefore has one active video workspace instead of a separate processing job for every output. Video type and frame density belong to source analysis. Notes, Key frames, Ask, and Create reuse that result. This avoids duplicate processing and keeps all derived outputs tied to one source artifact.</p>\n<h2 id=\"why-adversal-sits-behind-mcp\">Why Adversal sits behind MCP</h2>\n<p>The application does not call an Adversal REST endpoint. It lazily launches <code>adversal-cli</code> as a local MCP server over standard input/output and keeps one serialized client session for the application process.</p>\n<p>The persistent adapter fits Streamlit&#x27;s rerun model while preserving Adversal&#x27;s own background extraction task. Submission, status, quota, and authentication reuse that session. After a real application restart, Adversal&#x27;s local registry recovers request IDs while this app keeps the UI-facing job record in <code>runs/jobs.json</code>.</p>\n<p>The boundary also keeps Adversal-specific tool names and response parsing out of the workspace and document generators. Its cost is that response wording and browser-based OAuth remain integration dependencies that need focused testing.</p>\n<h2 id=\"artifacts-are-the-source-of-truth\">Artifacts are the source of truth</h2>\n<p>The completed <code>notes.md</code> and its referenced images are the durable result of video understanding. The app renders them before offering any LLM transformation. Users can inspect what Adversal produced, verify generated documents, and export the evidence without another model call.</p>\n<p>The native bundle preserves that source shape. The OKF 0.2 bundle adds a portable knowledge structure: a root index, source metadata, chapter concepts, and assets. It is designed for downstream agents that work more reliably with bounded Markdown concepts than with a raw multi-hour video.</p>\n<p>Browser downloads keep the source recognizable without trusting it as a path. The app removes the video extension, converts unsafe separators to underscores, and appends the output type. <strong>Download all</strong> composes the existing notes, native bundle, OKF bundle, and generated documents already cached for the selected backend. The native and OKF ZIPs stay nested so their internal contracts do not change.</p>\n<p>Image paths are treated as untrusted input. Rendering and export resolve each reference against the job directory and reject paths outside it. That rule keeps generated or altered Markdown from exposing unrelated local files through Streamlit or ZIP downloads.</p>\n<h2 id=\"why-retrieval-uses-qdrant\">Why retrieval uses Qdrant</h2>\n<p>Sending an entire transcript and every frame with each question wastes context. Ask instead divides notes along Adversal&#x27;s chapters and embeds both those chunks and compact frame descriptions. It retrieves text and visual evidence separately, then sends only the selected frame pixels to the model.</p>\n<p>Qdrant provides durable vector search without requiring a separate service for the local desktop target. One shared collection stores all completed videos, while a mandatory request-ID filter limits every query to the active source. A notes hash and deterministic point IDs make repeated indexing idempotent and allow changed notes to replace only their own points.</p>\n<p>Retrieval narrows the evidence; it does not guarantee truth. The final answer is still model-generated, so the UI exposes source headings, timestamps when available, similarity scores, frame thumbnails, and full notes for verification.</p>\n<h2 id=\"why-visual-indexing-is-explicit\">Why visual indexing is explicit</h2>\n<p>Describing every frame invokes a paid multimodal model. <strong>Build visual index</strong> makes that cost visible, saves each caption immediately, and lets an interrupted build resume. If the selected provider rejects image input, the preserved captions remain and the app still supports text-only Ask and Create. Captions improve retrieval; the final model also receives the retrieved pixels so it can verify visual details directly.</p>\n<h2 id=\"why-embeddings-do-not-follow-the-chat-selector\">Why embeddings do not follow the chat selector</h2>\n<p>The sidebar can switch generated text among OpenAI, Agnes AI, and Gemini. Embeddings, however, always use OpenAI <code>text-embedding-3-small</code>.</p>\n<p>Vectors from different embedding models do not share a reliable coordinate space. Silently changing models when the user changes chat provider would mix incompatible vectors in one collection and corrupt similarity results. Fixing one embedding model and naming it in the collection keeps retrieval consistent. The tradeoff is that Ask always requires an OpenAI key even when another provider writes the answer.</p>\n<h2 id=\"persistence-has-two-lifetimes\">Persistence has two lifetimes</h2>\n<p>Durable state lives under <code>runs/</code>:</p>\n<ul><li>uploaded source files;</li><li>Adversal Markdown and images;</li><li><code>jobs.json</code>; and</li><li>the Qdrant collection.</li></ul>\n<p>Interactive state lives in Streamlit session state:</p>\n<ul><li>the active job pointer;</li><li>generated document caches keyed by request, provider, and visual-evidence hash; and</li><li>Ask chat history.</li></ul>\n<p>This split makes expensive source processing and indexing resumable without turning the app into a multi-user database system. Generated documents are cheap enough to recreate and are keyed by request and provider to prevent repeated paid calls during ordinary Streamlit reruns.</p>\n<p>Download all reads only those existing cache entries. It never generates missing documents, so collecting files cannot silently trigger additional provider cost.</p>\n<p>The tradeoff is straightforward: restarting a browser session can restore a saved video and its vectors, but not its previous conversation or generated drafts.</p>\n<h2 id=\"why-the-app-targets-one-trusted-process\">Why the app targets one trusted process</h2>\n<p>The job registry uses a process-local lock, and embedded Qdrant owns files beneath <code>runs/qdrant</code>. These choices are simple and appropriate for one Streamlit process, whether it runs on a local computer or in the supported private Docker Space. They are not coordination mechanisms for several servers or users.</p>\n<p>The hosted configuration mounts one private bucket at <code>/data</code> for runs, Adversal OAuth state, and rotating logs. It preserves the same single-process behavior across container restarts; it does not turn the application into a shared service. A public or multi-user deployment would still need application authentication, encrypted storage, retention rules, shared locking or a transactional job store, and Qdrant Server or Cloud.</p>\n<h2 id=\"long-notes-and-bounded-generation\">Long notes and bounded generation</h2>\n<p>Generated documents use the complete notes when they are at most 50,000 characters. Longer notes are condensed in batches no larger than 30,000 characters before the final prompt. This bounds individual requests and reduces context pressure while preserving grounded facts and, for visual documents, Markdown image references.</p>\n<p>Reduction is separate from retrieval. Ask needs the most relevant excerpts for one question; document generation needs broad coverage of the whole video. They solve different context problems.</p>\n<h2 id=\"security-and-trust-boundaries\">Security and trust boundaries</h2>\n<p>There are three important boundaries:</p>\n<ol><li>Video and Markdown content are untrusted input. Paths are constrained to job directories before files are served or archived.</li><li>API keys come from the process environment or a gitignored <code>.env</code>; the application neither logs nor persists them in job records.</li><li>LLM output is assistance, not authoritative evidence. Prompts require grounding, but users still need to verify consequential claims.</li></ol>\n<p>Files and vectors are not encrypted and are retained until the user clears all runs. Keep the application local or private and single-user, and avoid sensitive video unless the underlying machine or bucket has an appropriate storage and retention policy.</p>\n<h2 id=\"where-to-go-next\">Where to go next</h2>\n<ul><li>Follow the <a href=\"#docs-tutorial\">tutorial</a> for a complete first run.</li><li>Use the <a href=\"#docs-howto\">how-to guides</a> for specific operations.</li><li>Consult the <a href=\"#docs-reference\">reference</a> for exact values and contracts.</li><li>Read the <a href=\"#docs-codebase-architecture\">codebase documentation</a> for implementation-level module evidence and maintenance risks.</li></ul>"}, {"slug": "docs-howto", "title": "How-to guides", "category": "Do", "description": "Task-focused recipes for launching, operating, troubleshooting, and deploying.", "source": "docs/HOW_TO.md", "content": "<h1 id=\"how-to-guides\">How-to guides</h1>\n<p>Use these recipes when you know the basics and need to complete a specific task. For a first run, start with the <a href=\"#docs-tutorial\">tutorial</a>.</p>\n<h2 id=\"choose-a-recipe\">Choose a recipe</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Goal</th><th>Section</th></tr></thead><tbody><tr><td>Launch locally</td><td><a href=\"#start-on-windows\">Start on Windows</a> or <a href=\"#start-manually\">Start manually</a></td></tr><tr><td>Sign in to Adversal</td><td><a href=\"#authenticate-adversal-locally\">Authenticate Adversal locally</a></td></tr><tr><td>Configure generation</td><td><a href=\"#configure-an-llm-provider\">Configure an LLM provider</a></td></tr><tr><td>Analyze a source</td><td><a href=\"#process-an-uploaded-video\">Process an uploaded video</a>, <a href=\"#process-only-part-of-a-video-or-request-exact-frames\">focus the analysis</a>, or <a href=\"#process-a-public-video-url\">process a public URL</a></td></tr><tr><td>Inspect or export evidence</td><td><a href=\"#browse-key-frames\">Browse key frames</a> or <a href=\"#download-agent-ready-artifacts\">Download agent-ready artifacts</a></td></tr><tr><td>Ask questions or create content</td><td><a href=\"#search-the-active-video\">Search the active video</a> or <a href=\"#create-a-derived-document\">Create a derived document</a></td></tr><tr><td>Recover work or diagnose a problem</td><td><a href=\"#resume-a-saved-job\">Resume a saved job</a>, <a href=\"#retry-a-status-check-without-resubmitting\">retry a status check</a>, or <a href=\"#recover-from-common-failures\">recover from common failures</a></td></tr></tbody></table></div>\n<h2 id=\"start-on-windows\">Start on Windows</h2>\n<p>Run the recommended launcher from the repository root:</p>\n<pre><code class=\"language-bat\">launch.cmd</code></pre>\n<p>It installs the required uv-managed Python, creates <code>.venv</code>, synchronizes the locked environment, creates <code>.env</code> when needed, warns about missing FFmpeg tools, and starts Streamlit. The older <code>launch.bat</code> remains for compatibility, but it does not pin Python or use the same locked setup.</p>\n<h2 id=\"start-manually\">Start manually</h2>\n<p>Use this route on another operating system or when managing uv yourself:</p>\n<pre><code class=\"language-bash\">uv python pin 3.13.13\nuv sync --locked --all-groups\nuv run streamlit run app.py</code></pre>\n<p>Copy <code>.env.example</code> to <code>.env</code> only when the keys are not already available as process environment variables. On PowerShell:</p>\n<pre><code class=\"language-powershell\">Copy-Item .env.example .env</code></pre>\n<h2 id=\"authenticate-adversal-locally\">Authenticate Adversal locally</h2>\n<p>The app asks for authentication only when an Adversal operation needs it.</p>\n<ol><li>Start the app and submit a video or open <strong>Quota</strong> and select <strong>Check remaining quota</strong>.</li><li>When the authentication banner appears, select <strong>Authenticate</strong>.</li><li>Complete the browser sign-in on the same computer that runs Streamlit.</li><li>Return to the app. It clears the authentication state and reruns automatically.</li></ol>\n<p>Adversal owns this OAuth session; there is no <code>ADVERSAL<em>API</em>KEY</code> environment variable. If authentication fails, keep the launch terminal open and use the newest sign-in flow.</p>\n<h2 id=\"deploy-to-hugging-face-spaces\">Deploy to Hugging Face Spaces</h2>\n<p>The hosted setup is a private Docker Space with a private bucket. Public or protected deployment is unsafe because all visitors would share the same Adversal account, run history, uploaded files, Qdrant index, and deletion control. The Hugging Face account must have a PRO subscription before it can create a Docker Space, even when the selected hardware is CPU Basic.</p>\n<p>The deployment target is:</p>\n<ul><li>Space: <code>pypi-ahmad/video-summarizer</code></li><li>Bucket: <code>pypi-ahmad/video-summarizer-data</code></li><li>Bucket mount: <code>/data</code></li><li>Streamlit port: <code>7860</code></li></ul>\n<p>The repository&#x27;s Docker files are ready to publish after the account and target storage are configured. This guide describes the intended target, not its current deployment state.</p>\n<p>The container maps <code>/data/runs</code>, <code>/data/adversal</code>, and <code>/data/logs</code> to the paths used by the application and <code>adversal-cli</code>. Hugging Face restarts therefore preserve jobs, uploads, notes, frames, vectors, Adversal login state, and rotating logs. Set <code>VIDEO<em>SUMMARIZER</em>DATA_DIR</code> only when the persistent bucket is mounted somewhere other than <code>/data</code>.</p>\n<p>Add provider credentials in <strong>Space Settings &gt; Secrets</strong>. Use only the names below; do not commit or upload a <code>.env</code> file:</p>\n<pre><code class=\"language-text\">OPENAI_API_KEY\nOPENAI_BASE_URL\nAGNES_API_KEY\nGOOGLE_API_KEY</code></pre>\n<p><code>OPENAI<em>BASE</em>URL</code> is optional. The other keys are required only for their corresponding provider, except Ask/search embeddings always require <code>OPENAI<em>API</em>KEY</code>.</p>\n<p>After the Space is created, authenticate Adversal for the first time:</p>\n<ol><li>Open the private Space and its <strong>Runtime logs</strong> in separate tabs.</li><li>Trigger an Adversal operation, such as <strong>Check remaining quota</strong>.</li><li>Select <strong>Authenticate</strong> in the app.</li><li>Open the temporary Adversal sign-in URL printed in the runtime logs.</li><li>Complete sign-in and return to the app.</li></ol>\n<p>The login session is stored in the private bucket, not in Git or a Space environment variable. After deployment, inspect hosted logs from an authenticated terminal with:</p>\n<pre><code class=\"language-powershell\">hf spaces logs pypi-ahmad/video-summarizer --tail 100\nhf spaces logs pypi-ahmad/video-summarizer --build --tail 100</code></pre>\n<h2 id=\"configure-an-llm-provider\">Configure an LLM provider</h2>\n<p>Set only the providers you intend to use:</p>\n<pre><code class=\"language-dotenv\">OPENAI_API_KEY=\nOPENAI_BASE_URL=\nAGNES_API_KEY=\nGOOGLE_API_KEY=</code></pre>\n<p><code>.env</code> does not override existing environment variables. Restart Streamlit after changing the environment.</p>\n<ul><li>Use <code>OPENAI<em>API</em>KEY</code> for GPT-5.6 Luna and for all Ask embeddings.</li><li>Set <code>OPENAI<em>BASE</em>URL</code> only for an OpenAI-compatible gateway or proxy.</li><li>Use <code>AGNES<em>API</em>KEY</code> for Agnes 2.5 Flash.</li><li>Use <code>GOOGLE<em>API</em>KEY</code> for Gemini 3.5 Flash Lite or Gemini 3.7 Flash.</li></ul>\n<p>Choose the chat backend from the sidebar. Ask still requires OpenAI embeddings even when Agnes or Gemini answers the final question.</p>\n<h3 id=\"switch-the-generation-backend\">Switch the generation backend</h3>\n<p>Use <strong>LLM backend</strong> in the sidebar before asking a question or creating a document. Changing the backend does not reprocess the video or rebuild compatible embeddings. Create caches a distinct document for each <code>(request_id, backend)</code> pair, while Ask uses the selected backend for the next answer.</p>\n<h2 id=\"process-an-uploaded-video\">Process an uploaded video</h2>\n<ol><li>Select <strong>Upload file</strong>.</li><li>Choose an <code>.mp4</code>, <code>.mov</code>, <code>.mkv</code>, or <code>.webm</code> file.</li><li>Select the video type and frame density.</li><li>Select <strong>Process video</strong>.</li><li>Complete Adversal authentication if prompted.</li></ol>\n<p>The uploaded filename is sanitized before the file is written inside its generated job directory.</p>\n<h2 id=\"process-only-part-of-a-video-or-request-exact-frames\">Process only part of a video or request exact frames</h2>\n<ol><li>Expand <strong>Advanced processing controls</strong> before submitting.</li><li>Enter an optional <strong>Start time</strong> and <strong>End time</strong> as seconds, <code>MM:SS</code>, or <code>HH:MM:SS</code>.</li><li>Enter exact frame timestamps separated by commas or new lines when you need specific screenshots.</li><li>Submit normally. The chosen range and timestamps are saved with the job.</li></ol>\n<p>Exact screenshots appear in <strong>Key frames</strong> with Adversal&#x27;s representative images. An invalid range or timestamp is shown using Adversal&#x27;s original validation message.</p>\n<h2 id=\"process-a-public-video-url\">Process a public video URL</h2>\n<ol><li>Select <strong>Video URL</strong>.</li><li>Paste a public URL supported by Adversal&#x27;s downloader.</li><li>Select the analysis profile and frame density.</li><li>Select <strong>Process video</strong>.</li></ol>\n<p>Authentication, access restrictions, and URL support are source-dependent. The app does not download the URL itself; it passes the URL to Adversal.</p>\n<h2 id=\"choose-an-analysis-profile\">Choose an analysis profile</h2>\n<ul><li>Use <strong>Generic</strong> when no specialized profile applies.</li><li>Use <strong>Lesson / tutorial</strong> for instructional material.</li><li>Use <strong>Interview</strong> for conversations and recorded Q&amp;A.</li><li>Use <strong>Meeting / webinar</strong> for collaborative sessions and presentations.</li></ul>\n<p>Choose <strong>Minimal</strong>, <strong>Selective</strong>, or <strong>Generous</strong> key frames based on how much visual context the notes need. This choice affects source analysis, not the documents you can create afterward.</p>\n<h2 id=\"browse-key-frames\">Browse key frames</h2>\n<ol><li>Open <strong>Key frames</strong> in a completed workspace.</li><li>Review the three-column gallery and image captions.</li><li>When the analysis contains more than 12 images, use <strong>Frame page</strong> to move through pages.</li></ol>\n<p>The gallery shows Markdown references and requested frames only when they resolve inside the job directory. If none exist, the app reports that the analysis returned no frames.</p>\n<h2 id=\"download-agent-ready-artifacts\">Download agent-ready artifacts</h2>\n<p>Open <strong>Notes</strong>, then choose:</p>\n<ul><li><strong>Download Markdown</strong> for Adversal&#x27;s source <code>notes.md</code>;</li><li><strong>Download native bundle</strong> for the Markdown plus its safely resolved referenced images; or</li><li><strong>Download OKF 0.2 bundle</strong> for <code>index.md</code>, <code>video.md</code>, chapter concepts, and assets.</li></ul>\n<p>Use <strong>Download all</strong> beside the workspace title to collect those three downloads plus any Create documents already generated for the active video and selected backend. It never generates missing documents or invokes an LLM.</p>\n<p>Download names use the safe original video stem and output type, for example <code>My<em>Lecture</em>notes.md</code>, <code>My<em>Lecture</em>okf<em>0</em>2<em>bundle.zip</code>, and <code>My</em>Lecture<em>all</em>downloads.zip</code>. Exports exclude the uploaded video, Qdrant data, job history, and unreferenced files.</p>\n<h2 id=\"search-the-active-video\">Search the active video</h2>\n<ol><li>Open <strong>Ask</strong>.</li><li>Select <strong>Build visual index</strong> to describe every safe frame with the active backend. The app saves each caption immediately, so the same action resumes interrupted work.</li><li>Enter a question about the active video.</li><li>Expand <strong>Sources</strong> to inspect text citations and frame thumbnails, captions, approximate timestamps, and scores.</li><li>Open <strong>Full notes</strong> when the retrieved evidence is insufficient.</li></ol>\n<p>Qdrant indexes chapter text plus available frame descriptions. Each question retrieves up to five text chunks and three frames, then sends the actual retrieved pixels to the selected model. Search always filters on the active request ID. If a backend rejects images, switch backend and resume, or turn off <strong>Use visual evidence in Ask and Create</strong> to continue text-only without deleting saved captions.</p>\n<h2 id=\"create-a-derived-document\">Create a derived document</h2>\n<p>Open <strong>Create</strong>, optionally build the visual index, and choose one of these outputs:</p>\n<ul><li>Meeting/webinar summarizer</li><li>Content triage</li><li>Video to blog post</li><li>Quiz and flashcards</li><li>SOP/how-to guide</li><li>Interview insight pack</li><li>FAQ/help-center article</li></ul>\n<p>Select <strong>Generate</strong> to start the paid call. Each output uses the completed notes and, when available, retrieves up to four relevant frames and sends their pixels to the selected model. Notes longer than 50,000 characters are first condensed in bounded batches. Image-oriented outputs preserve supported Markdown image references. After generation, the document is also included in <strong>Download all</strong> while that job and backend remain cached in the browser session.</p>\n<h2 id=\"resume-a-saved-job\">Resume a saved job</h2>\n<p>Open <strong>Resume a previous job</strong> in the sidebar and select one of the ten newest entries. The label includes the source name, persisted status, and request-ID prefix.</p>\n<p>Resuming restores the job as the active workspace. Generated documents and chat history do not return after a Streamlit session ends, but source files and Qdrant vectors remain on disk.</p>\n<h2 id=\"retry-a-status-check-without-resubmitting\">Retry a status check without resubmitting</h2>\n<p>Use this when a saved request reaches <code>UNKNOWN</code>, the MCP transport fails, or a temporary status response cannot be parsed.</p>\n<ol><li>Keep the failed job active, or restore it from <strong>Resume a previous job</strong>.</li><li>Select <strong>Retry status check</strong>.</li><li>Let the status panel query the same Adversal request ID again.</li></ol>\n<p>This action changes the local job back to <code>RUNNING</code>; it does not upload the video or call <code>process_video</code> again. If Adversal reports a terminal pipeline failure again, use <strong>Start over</strong> only after deciding that a new remote submission is appropriate.</p>\n<h2 id=\"leave-restart-or-delete-a-workspace\">Leave, restart, or delete a workspace</h2>\n<ul><li><strong>Process another video</strong> leaves the completed workspace and returns to submission; it does not delete files.</li><li><strong>Start over</strong> leaves a failed job; the failed record and directory remain persisted.</li><li><strong>Resume a previous job</strong> restores a persisted job as the active workspace.</li><li><strong>Clear all runs</strong> permanently removes every job, upload, artifact, and Qdrant vector.</li></ul>\n<h2 id=\"recover-from-common-failures\">Recover from common failures</h2>\n<h3 id=\"inspect-live-and-saved-logs\">Inspect live and saved logs</h3>\n<p>Keep the <code>launch.cmd</code> terminal open to see Streamlit messages and application progress. The same events are retained in <code>logs/video-summarizer.log</code>; older files rotate to <code>.1</code>, <code>.2</code>, and <code>.3</code> when the active file reaches 5 MiB.</p>\n<p>To include stack-frame locations and cache details, set:</p>\n<pre><code class=\"language-dotenv\">VIDEO_SUMMARIZER_LOG_LEVEL=DEBUG</code></pre>\n<p>Restart the app after changing the level. Logs contain operation metadata, IDs, models, counts, timing, statuses, and error types. They intentionally omit filenames, URLs, prompts, transcripts, generated content, exception messages, and secret values.</p>\n<h3 id=\"adversal-requests-authentication\">Adversal requests authentication</h3>\n<p>Select <strong>Authenticate</strong> in the banner and complete the browser flow on the Streamlit server computer. Authentication succeeds only when Adversal returns <code>AUTHENTICATED</code>. If it returns <code>AUTHENTICATION FAILED</code>, the banner remains active and displays that message; start a new browser flow.</p>\n<h3 id=\"an-adversal-status-check-fails-or-becomes-unknown\">An Adversal status check fails or becomes unknown</h3>\n<p>Read the error shown for the active job. Select <strong>Retry status check</strong> to query the same request without uploading the source again. Avoid <strong>Start over</strong> until the existing request is known to be unusable, because a new submission may consume quota twice.</p>\n<h3 id=\"a-provider-key-is-missing\">A provider key is missing</h3>\n<p>Set the variable named in the error, restart Streamlit, and choose the matching backend. Ask requires <code>OPENAI<em>API</em>KEY</code> regardless of the selected chat provider.</p>\n<h3 id=\"local-video-processing-fails\">Local video processing fails</h3>\n<p>Confirm both tools are available:</p>\n<pre><code class=\"language-powershell\">ffmpeg -version\nffprobe -version</code></pre>\n<p>Then synchronize dependencies and restart:</p>\n<pre><code class=\"language-powershell\">uv sync --locked --all-groups\nuv run streamlit run app.py</code></pre>\n<h3 id=\"a-public-url-download-times-out\">A public URL download times out</h3>\n<p>Adversal downloads URL sources on its own infrastructure. A long, protected, or slow source may exceed the download window before a request ID is created. Confirm that the URL is publicly reachable. If it still fails, download the video through an authorized route and use <strong>Upload file</strong> instead. The app displays Adversal&#x27;s timeout message directly rather than replacing it with a missing-request-ID error.</p>\n<h3 id=\"a-completed-job-cannot-render\">A completed job cannot render</h3>\n<p>Confirm the job directory and its <code>notes.md</code> still exist. Clearing <code>runs/</code> invalidates all saved job records and artifacts together.</p>\n<h2 id=\"delete-all-local-run-data\">Delete all local run data</h2>\n<ol><li>Open <strong>Danger zone</strong>.</li><li>Enable <strong>I understand this deletes all local run data</strong>.</li><li>Select <strong>Clear all runs</strong>.</li></ol>\n<p>This closes the local Qdrant client and permanently removes <code>runs/</code>, including uploaded videos, notes, images, vectors, and <code>jobs.json</code>. This operation cannot be undone from the app.</p>"}, {"slug": "docs-reference", "title": "Reference", "category": "Understand", "description": "Exact runtime settings, contracts, paths, models, and limits.", "source": "docs/REFERENCE.md", "content": "<h1 id=\"reference\">Reference</h1>\n<p>This page lists the application&#x27;s supported inputs, configuration, controls, storage, and runtime contracts. For task instructions, use the <a href=\"#docs-howto\">how-to guides</a>.</p>\n<h2 id=\"runtime\">Runtime</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Python</td><td>3.13 or newer; launch workflow pins 3.13.13</td></tr><tr><td>Environment manager</td><td>uv with <code>.venv</code> in the project root</td></tr><tr><td>Application entry point</td><td><code>uv run streamlit run app.py</code></td></tr><tr><td>Canonical Windows entry point</td><td><code>launch.cmd</code></td></tr><tr><td>Video integration</td><td><code>adversal-cli</code> over MCP stdio</td></tr><tr><td>Poll interval</td><td>8 seconds</td></tr><tr><td>Job root</td><td><code>runs/</code></td></tr><tr><td>Vector store</td><td>Embedded persistent Qdrant at <code>runs/qdrant/</code></td></tr></tbody></table></div>\n<p><code>ffmpeg</code> and <code>ffprobe</code> must be available on <code>PATH</code> for local video inspection by Adversal.</p>\n<h3 id=\"hugging-face-space\">Hugging Face Space</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Space</td><td><code>pypi-ahmad/video-summarizer</code></td></tr><tr><td>Visibility</td><td>Private</td></tr><tr><td>SDK</td><td>Docker</td></tr><tr><td>Hardware</td><td>CPU Basic</td></tr><tr><td>Application port</td><td><code>7860</code></td></tr><tr><td>Persistent bucket</td><td><code>pypi-ahmad/video-summarizer-data</code></td></tr><tr><td>Bucket mount</td><td><code>/data</code></td></tr></tbody></table></div>\n<p>Creating a Docker Space requires a paid Hugging Face plan. CPU Basic has no hourly hardware charge, but compute-Space creation is subscription-gated. The table describes the checked-in deployment target; it does not assert the live deployment state.</p>\n<p>The container startup script maps these persistent paths:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Persistent path</th><th>Runtime path</th><th>Contents</th></tr></thead><tbody><tr><td><code>/data/runs</code></td><td><code>/home/user/app/runs</code></td><td>Jobs, uploads, notes, frames, Qdrant</td></tr><tr><td><code>/data/adversal</code></td><td><code>/home/user/.adversal</code></td><td>Adversal OAuth session and job

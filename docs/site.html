h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Area</th><th>Value</th><th>Evidence</th></tr></thead><tbody><tr><td>Primary language</td><td>Python</td><td><code>pyproject.toml</code>, root <code>*.py</code> modules</td></tr><tr><td>Runtime + version</td><td>CPython 3.13.13; project accepts Python 3.13+</td><td><code>.python-version</code>, <code>pyproject.toml</code></td></tr><tr><td>Package manager</td><td>uv with a committed lockfile</td><td><code>uv.lock</code>, <code>launch.cmd</code></td></tr><tr><td>Module/build system</td><td>Root-level Python modules; no package build backend</td><td><code>app.py</code>, <code>pyproject.toml</code></td></tr></tbody></table></div>\n<h3 id=\"2-production-frameworks-and-dependencies\">2) Production Frameworks and Dependencies</h3>\n<p>The versions below came from <code>uv tree --depth 1</code> on 2026-08-23.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Dependency</th><th>Version</th><th>Role in system</th><th>Evidence</th></tr></thead><tbody><tr><td>Streamlit</td><td>1.62.0</td><td>Web UI, session state, fragments, chat, rendering</td><td><code>app.py</code>, <code>pipeline.py</code>, <code>modes.py</code></td></tr><tr><td>adversal-cli</td><td>0.1.2</td><td>Local MCP server for video processing and OAuth</td><td><code>adversal_client.py</code>, <code>uv.lock</code></td></tr><tr><td>MCP</td><td>1.29.0</td><td>stdio client transport to <code>adversal-cli</code></td><td><code>adversal_client.py</code></td></tr><tr><td>OpenAI</td><td>3.3.1</td><td>OpenAI/Agnes text and image requests plus OpenAI embeddings</td><td><code>llm.py</code></td></tr><tr><td>google-genai</td><td>2.19.0</td><td>Gemini text and image requests</td><td><code>llm.py</code></td></tr><tr><td>Qdrant Client</td><td>1.19.0</td><td>Persistent text/frame-description vectors and cosine retrieval</td><td><code>vector_store.py</code></td></tr><tr><td>python-dotenv</td><td>1.2.3</td><td>Optional local <code>.env</code> loading</td><td><code>llm.py</code>, <code>.env.example</code></td></tr></tbody></table></div>\n<p>The hosted image uses <code>python:3.13-slim-trixie</code>, uv 0.12.5, and system FFmpeg. It runs as UID 1000 and exposes Streamlit on port 7860 through the container command.</p>\n<h3 id=\"3-development-toolchain\">3) Development Toolchain</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Tool</th><th>Purpose</th><th>Evidence</th></tr></thead><tbody><tr><td>uv</td><td>Python, environment, dependency, and command management</td><td><code>launch.cmd</code>, <code>uv.lock</code></td></tr><tr><td>Ruff 0.16.4</td><td>Linting and formatting</td><td><code>pyproject.toml</code>, <code>uv tree --depth 1</code></td></tr><tr><td>ty 0.0.74</td><td>Static type checking for Python 3.13</td><td><code>pyproject.toml</code>, <code>uv tree --depth 1</code></td></tr><tr><td>pytest 9.1.1</td><td>Regression test runner</td><td><code>pyproject.toml</code>, <code>tests/test_regressions.py</code></td></tr></tbody></table></div>\n<h3 id=\"4-key-commands\">4) Key Commands</h3>\n<pre><code class=\"language-bash\">uv sync --all-groups\nuv run streamlit run app.py\nuv run pytest -q\nuv run ruff check .\nuv run ty check</code></pre>\n<p>Windows bootstrap and launch: <code>launch.cmd</code>.</p>\n<h3 id=\"5-environment-and-config\">5) Environment and Config</h3>\n<ul><li>Config sources: <code>pyproject.toml</code>, <code>.python-version</code>, <code>.env.example</code>, environment variables, <code>Dockerfile</code>, and <code>container-entrypoint.sh</code>.</li><li>Required env vars depend on selected functionality: <code>OPENAI<em>API</em>KEY</code>, <code>AGNES<em>API</em>KEY</code>, <code>GOOGLE<em>API</em>KEY</code>; <code>OPENAI<em>BASE</em>URL</code> is optional.</li><li><code>OPENAI<em>API</em>KEY</code> is also required for knowledge-base embeddings regardless of selected chat backend.</li><li>Runtime constraints: <code>uv</code>, Python 3.13+, <code>adversal-cli</code>, and <code>ffmpeg</code>/<code>ffprobe</code> on <code>PATH</code>; OAuth opens a browser on the server machine.</li><li><code>VIDEO<em>SUMMARIZER</em>LOG_LEVEL</code> optionally selects <code>DEBUG</code>, <code>INFO</code>, <code>WARNING</code>, <code>ERROR</code>, or <code>CRITICAL</code>; default <code>INFO</code>.</li><li><code>VIDEO<em>SUMMARIZER</em>DATA_DIR</code> optionally changes the container persistence root; default <code>/data</code>.</li><li>Docker deployment maps persistent data subdirectories to runs, Adversal state, and logs. <code>.github/workflows/ci.yml</code> defines a Windows quality gate.</li></ul>\n<h3 id=\"6-evidence\">6) Evidence</h3>\n<ul><li><code>pyproject.toml</code></li><li><code>uv.lock</code></li><li><code>.python-version</code></li><li><code>.env.example</code></li><li><code>launch.cmd</code></li><li><code>llm.py</code></li><li><code>.github/workflows/ci.yml</code></li><li><code>Dockerfile</code></li><li><code>container-entrypoint.sh</code></li></ul>"}, {"slug": "docs-codebase-structure", "title": "Codebase Structure", "category": "Codebase", "description": "A map of source files, tests, docs, and runtime data directories.", "source": "docs/codebase/STRUCTURE.md", "content": "<h1 id=\"codebase-structure\">Codebase Structure</h1>\n<h2 id=\"core-sections-required\">Core Sections (Required)</h2>\n<h3 id=\"1-top-level-map\">1) Top-Level Map</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Path</th><th>Purpose</th><th>Evidence</th></tr></thead><tbody><tr><td><code>app.py</code></td><td>Streamlit entry point, source submission and process-once workspace routing</td><td><code>main()</code>, <code>render<em>submit</em>form()</code>, <code>render_workspace()</code></td></tr><tr><td><code>adversal_client.py</code></td><td>Process-wide MCP stdio adapter with one worker thread, serialized request queue, and reusable <code>adversal-cli</code> session</td><td><code><em>MCPConnection</code>, <code></em>call_tool()</code>, public wrapper functions</td></tr><tr><td><code>pipeline.py</code></td><td>Job model, JSON persistence, polling, result loading and image-aware Markdown rendering</td><td><code>Job</code>, <code><em>save</em>job()</code>, <code>render<em>job</em>progress()</code></td></tr><tr><td><code>artifacts.py</code></td><td>Safe frame discovery, portable filenames, native/OKF exports, and Download All packaging</td><td><code>download<em>filename()</code>, <code>build</em>all<em>downloads</em>bundle()</code></td></tr><tr><td><code>modes.py</code></td><td>Multimodal Qdrant chat, seven generated outputs, visual-index controls, and cache discovery</td><td><code>render<em>visual</em>index<em>controls()</code>, <code>CREATE</em>RENDERERS</code></td></tr><tr><td><code>visual_evidence.py</code></td><td>Safe frame discovery, resumable caption manifest, evidence hashes, and provider image inputs</td><td><code>build<em>evidence()</code>, <code>load</em>evidence()</code></td></tr><tr><td><code>vector_store.py</code></td><td>Persistent text/frame Qdrant indexing and request-filtered search</td><td><code>index<em>video()</code>, <code>search</em>video_evidence()</code></td></tr><tr><td><code>llm.py</code></td><td>OpenAI-compatible and Gemini provider dispatch; OpenAI embeddings</td><td><code>LLM_OPTIONS</code>, <code>chat()</code>, <code>embed()</code></td></tr><tr><td><code>observability.py</code></td><td>Central terminal and rotating-file logging with secret redaction</td><td><code>configure<em>logging()</code>, <code>log</em>failure()</code></td></tr><tr><td><code>Dockerfile</code></td><td>Hugging Face-compatible Python 3.13/uv/FFmpeg image</td><td>image stages and runtime command</td></tr><tr><td><code>container-entrypoint.sh</code></td><td>Maps persistent <code>/data</code> storage into application and Adversal paths</td><td>startup symlinks</td></tr><tr><td><code>.dockerignore</code></td><td>Excludes secrets, runtime data, development files, and docs from the image build context</td><td>ignore patterns</td></tr><tr><td><code>launch.cmd</code></td><td>Self-contained Windows uv/Python/venv bootstrap and Streamlit launch</td><td>batch commands</td></tr><tr><td><code>launch.bat</code></td><td>Legacy compatibility launcher without the pinned/locked guarantees of <code>launch.cmd</code></td><td>batch commands</td></tr><tr><td><code>scripts/build<em>docs</em>site.py</code></td><td>Builds the self-contained offline HTML documentation site from tracked Markdown</td><td><code>build_site()</code>, <code>--check</code></td></tr><tr><td><code>tests/</code></td><td>Focused security, caching, persistence, and observability regressions</td><td><code>tests/test<em>regressions.py</code>, <code>tests/test</em>observability.py</code></td></tr><tr><td><code>docs/</code></td><td>User guide, technical architecture, and codebase onboarding material</td><td><code>docs/USAGE.md</code>, <code>docs/ARCHITECTURE.md</code></td></tr><tr><td><code>runs/</code></td><td>Gitignored runtime jobs, notes, images, index and <code>jobs.json</code></td><td><code>pipeline.RUNS_DIR</code>, <code>.gitignore</code></td></tr><tr><td><code>docs/codebase/</code></td><td>Generated codebase onboarding documents</td><td>this documentation set</td></tr></tbody></table></div>\n<h3 id=\"2-entry-points\">2) Entry Points</h3>\n<ul><li>Main runtime entry: <code>app.py:main()</code>.</li><li>Secondary entry points: canonical <code>launch.cmd</code> bootstraps <code>.venv</code> and starts <code>.venv\\Scripts\\python.exe -m streamlit run app.py</code>; legacy <code>launch.bat</code> performs a less strict uv setup. The adapter lazily starts one <code>adversal-cli</code> integration subprocess and keeps it for the application-process lifetime.</li><li>Entry selection: Streamlit executes <code>app.py</code>; its <code>if <strong>name</strong> == &quot;<strong>main</strong>&quot;</code> guard calls <code>main()</code>.</li></ul>\n<h3 id=\"3-module-boundaries\">3) Module Boundaries</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Boundary</th><th>What belongs here</th><th>What must not be here</th></tr></thead><tbody><tr><td><code>app.py</code></td><td>Page composition, widgets, session routing</td><td>Provider SDK calls or MCP transport details</td></tr><tr><td><code>adversal_client.py</code></td><td>Adversal tool arguments, worker-thread/queue ownership, MCP lifecycle, response contracts, and integration error translation</td><td>Streamlit UI or mode-specific presentation</td></tr><tr><td><code>pipeline.py</code></td><td>Shared job lifecycle and local result files</td><td>Provider-specific LLM prompts</td></tr><tr><td><code>artifacts.py</code></td><td>Adversal artifact parsing and portable exports</td><td>UI routing or remote service calls</td></tr><tr><td><code>modes.py</code></td><td>Generated-output prompts, chunking, RAG chat and presentation</td><td>MCP session construction or Qdrant lifecycle details</td></tr><tr><td><code>visual_evidence.py</code></td><td>Safe frame discovery, durable captions, evidence hashes, and trusted image inputs</td><td>Streamlit presentation or vector queries</td></tr><tr><td><code>vector_store.py</code></td><td>Qdrant collection, point payload and filtering policy</td><td>Streamlit presentation or MCP transport</td></tr><tr><td><code>llm.py</code></td><td>Multimodal LLM clients, model selection and embeddings</td><td>Streamlit state or job persistence</td></tr><tr><td><code>observability.py</code></td><td>Logging configuration, sanitization, and failure metadata</td><td>User content or business workflows</td></tr></tbody></table></div>\n<p>These boundaries describe the current code. The project does not enforce them with a package system.</p>\n<h3 id=\"4-naming-and-organization-rules\">4) Naming and Organization Rules</h3>\n<ul><li>File naming: lowercase <code>snake_case.py</code>; application modules live at repository root.</li><li>Directory organization: flat, layer-oriented layout rather than a package or feature tree.</li><li>Python symbols: <code>snake_case</code> functions/variables, <code>PascalCase</code> dataclasses/exceptions, uppercase constants.</li><li>Imports: absolute imports between root modules; no aliases or relative imports.</li><li>Generated/runtime directories (<code>runs/</code>, caches, knowledge graphs) are not source modules.</li></ul>\n<h3 id=\"5-evidence\">5) Evidence</h3>\n<ul><li>repository scan used to write these documents</li><li><code>app.py</code></li><li><code>pipeline.py</code></li><li><code>modes.py</code></li><li><code>visual_evidence.py</code></li><li><code>vector_store.py</code></li><li><code>adversal_client.py</code></li><li><code>llm.py</code></li><li><code>observability.py</code></li><li><code>Dockerfile</code></li><li><code>container-entrypoint.sh</code></li><li><code>.gitignore</code></li><li><code>tests/test_regressions.py</code></li></ul>"}, {"slug": "docs-codebase-testing", "title": "Testing Patterns", "category": "Codebase", "description": "Existing verification patterns and the current testing gap analysis.", "source": "docs/codebase/TESTING.md", "content": "<h1 id=\"testing-patterns\">Testing Patterns</h1>\n<h2 id=\"core-sections-required\">Core Sections (Required)</h2>\n<h3 id=\"1-test-stack-and-commands\">1) Test Stack and Commands</h3>\n<ul><li>The test framework is pytest 9.1.1, installed in the <code>dev</code> dependency group.</li><li>Tests use pytest assertions and its built-in <code>monkeypatch</code> fixture.</li><li>Commands:</li></ul>\n<pre><code class=\"language-bash\">uv run pytest -q\nuv run ruff check .\nuv run ty check\n# [TODO] no unit-only, integration/E2E, or coverage command exists</code></pre>\n<h3 id=\"2-test-layout\">2) Test Layout</h3>\n<ul><li>Test files live under <code>tests/</code> and follow the <code>test_*.py</code> naming pattern.</li><li><code>pyproject.toml</code> adds the repository root to pytest&#x27;s Python path.</li><li>No <code>conftest.py</code> or shared fixtures exist. <code>.github/workflows/ci.yml</code> runs the quality gate on Windows for pushes and pull requests targeting <code>main</code>.</li></ul>\n<h3 id=\"3-test-scope-matrix\">3) Test Scope Matrix</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Scope</th><th>Covered?</th><th>Typical target</th><th>Notes</th></tr></thead><tbody><tr><td>Unit</td><td>Partial</td><td>Upload paths, Markdown images, Adversal contracts/lifecycle, provider and multimodal payloads, resumable frame evidence, text/frame Qdrant filtering, exports, caching, logging</td><td>Thirty-four focused regressions exist</td></tr><tr><td>Integration</td><td>Partial</td><td>Concurrent JSON persistence and directory allocation</td><td>Uses temporary local files; external services remain mocked/uncovered</td></tr><tr><td>E2E</td><td>No</td><td>Upload/URL through completion and mode rendering</td><td>No automated live-service flow exists</td></tr></tbody></table></div>\n<h3 id=\"4-mocking-and-isolation-strategy\">4) Mocking and Isolation Strategy</h3>\n<ul><li><code>monkeypatch</code> replaces session state, provider clients, LLM calls, embeddings, logging limits and pipeline paths; Qdrant tests use its in-memory client.</li><li>ZIP regressions inspect Download All members, nested native/OKF layouts, cached-output scoping, and safe Unicode-aware filenames without making external calls.</li><li><code>tmp_path</code> isolates uploaded files, indexes and job persistence.</li><li>External Adversal and provider calls are not made by the regression suite.</li></ul>\n<h3 id=\"5-coverage-and-quality-signals\">5) Coverage and Quality Signals</h3>\n<ul><li>Coverage tool + threshold: <code>[TODO]</code> not configured.</li><li>Current reported coverage: <code>[TODO]</code> no coverage tool is configured.</li><li>Static quality: Ruff and ty pass on 2026-08-23.</li><li>Known gaps: MCP result parsing, status transitions, full mode rendering, authentication and live provider behavior.</li></ul>\n<h3 id=\"6-evidence\">6) Evidence</h3>\n<ul><li><code>pyproject.toml</code></li><li><code>uv.lock</code></li><li><code>tests/test_regressions.py</code></li><li><code>tests/test_observability.py</code></li><li><code>.github/workflows/ci.yml</code></li><li><code>uv run pytest -q</code></li><li><code>uv run ruff check .</code> output: <code>All checks passed!</code></li><li><code>uv run ty check</code> output: <code>All checks passed!</code></li></ul>"}]</script>
  <script>
    const pages = JSON.parse(document.getElementById("docs-data").textContent);
    const groups = ["Start here", "Learn", "Do", "Understand", "Operate", "Codebase", "Documentation"];
    const nav = document.getElementById("nav");
    const content = document.getElementById("content");
    const search = document.getElementById("search");
    const pageCount = document.getElementById("page-count");

    function buildNav(filter = "") {
      const query = filter.trim().toLowerCase();
      nav.innerHTML = "";
      groups.forEach(group => {
        const entries = pages.filter(page => page.category === group &&
          (!query || `${page.title} ${page.description}`.toLowerCase().includes(query)));
        if (!entries.length) return;
        const section = document.createElement("div");
        section.className = "nav-group";
        section.innerHTML = `<div class="nav-label">${group}</div>`;
        entries.forEach(page => {
          const link = document.createElement("a");
          link.href = `#${page.slug}`;
          link.dataset.slug = page.slug;
          link.innerHTML = `${page.title}<small>${page.description}</small>`;
          section.appendChild(link);
        });
        nav.appendChild(section);
      });
    }

    function showPage() {
      const route = window.location.hash.slice(1) || "home";
      const [slug, anchor] = route.split("/", 2);
      const page = pages.find(candidate => candidate.slug === slug) || pages[0];
      if (page.slug !== slug) window.history.replaceState(null, "", `#${page.slug}`);
      const isHome = page.slug === "home";
      content.innerHTML = isHome ? page.content :
        `<header class="page-meta"><p class="eyebrow">${page.category}</p><h1>${page.title}</h1><p>${page.description}</p><span class="source-path">${page.source}</span></header><article class="markdown-body">${page.content}</article>`;
      document.title = `${page.title} · Video Summarizer docs`;
      document.querySelectorAll(".nav a").forEach(link => link.classList.toggle("active", link.dataset.slug === page.slug));
      pageCount.textContent = `${pages.length - 1} source docs`;
      window.scrollTo({top: 0, behavior: "instant"});
      if (anchor) document.getElementById(anchor)?.scrollIntoView();
    }

    search.addEventListener("input", event => buildNav(event.target.value));
    document.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") { event.preventDefault(); search.focus(); }
    });
    window.addEventListener("hashchange", showPage);
    buildNav();
    showPage();
  </script>

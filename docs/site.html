registry</td></tr><tr><td><code>/data/logs</code></td><td><code>/home/user/app/logs</code></td><td>Rotating application logs</td></tr></tbody></table></div>\n<p>Space secrets are exposed as environment variables at runtime. Secret values are never part of the image or repository. Adversal authentication is completed interactively from the private runtime-log URL and persisted in <code>/data/adversal</code>.</p>\n<h2 id=\"environment-variables\">Environment variables</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Variable</th><th>Required for</th><th>Default or behavior</th></tr></thead><tbody><tr><td><code>OPENAI<em>API</em>KEY</code></td><td>OpenAI chat and every Ask embedding operation</td><td>No default</td></tr><tr><td><code>OPENAI<em>BASE</em>URL</code></td><td>Optional OpenAI-compatible proxy or gateway</td><td>OpenAI SDK default endpoint</td></tr><tr><td><code>AGNES<em>API</em>KEY</code></td><td>Agnes chat</td><td>No default</td></tr><tr><td><code>GOOGLE<em>API</em>KEY</code></td><td>Gemini chat</td><td>No default</td></tr><tr><td><code>VIDEO<em>SUMMARIZER</em>LOG_LEVEL</code></td><td>Application logging verbosity</td><td><code>INFO</code></td></tr><tr><td><code>VIDEO<em>SUMMARIZER</em>DATA_DIR</code></td><td>Container root for persistent runs, Adversal state, and logs</td><td><code>/data</code></td></tr></tbody></table></div>\n<p><code>python-dotenv</code> loads <code>.env</code> with <code>override=False</code>; existing process environment values take precedence. Adversal authentication is managed by <code>adversal-cli</code> through browser OAuth and has no application environment variable.</p>\n<h2 id=\"chat-and-embedding-models\">Chat and embedding models</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Sidebar label</th><th>Provider</th><th>Model</th><th>Reasoning setting</th></tr></thead><tbody><tr><td>OpenAI - GPT-5.6 Luna</td><td>OpenAI</td><td><code>gpt-5.6-luna</code></td><td><code>reasoning_effort=&quot;medium&quot;</code></td></tr><tr><td>Agnes AI - Agnes 2.5 Flash</td><td>Agnes AI</td><td><code>agnes-2.5-flash</code></td><td>Provider default</td></tr><tr><td>Google - Gemini 3.5 Flash Lite</td><td>Google</td><td><code>gemini-3.5-flash-lite</code></td><td><code>thinking_level=MEDIUM</code></td></tr><tr><td>Google - Gemini 3.7 Flash</td><td>Google</td><td><code>gemini-3.7-flash</code></td><td><code>thinking_level=MEDIUM</code></td></tr></tbody></table></div>\n<p>The first option, GPT-5.6 Luna, is the UI default. Embeddings always use OpenAI <code>text-embedding-3-small</code>; the sidebar selection affects chat generation only.</p>\n<h2 id=\"video-inputs\">Video inputs</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Input</th><th>Accepted values</th></tr></thead><tbody><tr><td>Upload</td><td><code>.mp4</code>, <code>.mov</code>, <code>.mkv</code>, <code>.webm</code></td></tr><tr><td>URL</td><td>Public video URL accepted by Adversal</td></tr></tbody></table></div>\n<p>Uploaded files are written beneath a UUID-bearing job directory. The application keeps only the client filename&#x27;s basename and verifies that the resolved destination remains inside that directory.</p>\n<h2 id=\"analysis-options\">Analysis options</h2>\n<h3 id=\"video-type\">Video type</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>UI label</th><th>Adversal value</th></tr></thead><tbody><tr><td>Generic</td><td><code>generic</code></td></tr><tr><td>Lesson / tutorial</td><td><code>lesson</code></td></tr><tr><td>Interview</td><td><code>interview</code></td></tr><tr><td>Meeting / webinar</td><td><code>meeting</code></td></tr></tbody></table></div>\n<p>Default: <code>Generic</code>.</p>\n<h3 id=\"key-visual-frames\">Key visual frames</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>UI label</th><th>Adversal value</th></tr></thead><tbody><tr><td>Minimal</td><td><code>minimal</code></td></tr><tr><td>Selective</td><td><code>selective</code></td></tr><tr><td>Generous</td><td><code>generous</code></td></tr></tbody></table></div>\n<p>Default: <code>Selective</code>.</p>\n<h3 id=\"focused-processing\">Focused processing</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>UI field</th><th>Accepted values</th><th>Default</th></tr></thead><tbody><tr><td>Start time</td><td>Seconds, <code>MM:SS</code>, or <code>HH:MM:SS</code></td><td>Empty</td></tr><tr><td>End time</td><td>Seconds, <code>MM:SS</code>, or <code>HH:MM:SS</code></td><td>Empty</td></tr><tr><td>Exact frame timestamps</td><td>Comma- or line-separated values in the same formats</td><td>Empty</td></tr></tbody></table></div>\n<p>Exact frames are written beneath <code>&lt;job&gt;/requested_frames</code> and appear in the Key frames view when their resolved paths remain inside the job directory.</p>\n<h2 id=\"job-states\">Job states</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>State</th><th>Meaning</th></tr></thead><tbody><tr><td><code>RUNNING</code></td><td>A request ID exists and the fragment continues polling</td></tr><tr><td><code>COMPLETED</code></td><td>Adversal reported completion; workspace views read <code>notes.md</code> and images</td></tr><tr><td><code>FAILED</code></td><td>Adversal or polling failed; the stored job includes an error when available</td></tr></tbody></table></div>\n<p><code>UNKNOWN</code> and unrecognized responses become <code>FAILED</code> with the original Adversal message. <strong>Retry status check</strong> resumes polling the same request ID without resubmitting the video. A completed job records <code>completed_at</code>. <strong>Start over</strong> clears the active session pointer but does not remove the persisted job or files.</p>\n<h2 id=\"workspace-controls\">Workspace controls</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>View</th><th>Behavior</th></tr></thead><tbody><tr><td>Notes</td><td>Source Markdown, metrics, rendered referenced images, and three downloads</td></tr><tr><td>Key frames</td><td>Referenced and explicitly requested safe local images, 12 per page in three columns</td></tr><tr><td>Ask</td><td>Five text and up to three frame matches, multimodal answer, visible sources, and full notes</td></tr><tr><td>Create</td><td>One of seven documents using notes and up to four retrieved frames</td></tr></tbody></table></div>\n<p>Only one video is active in a browser session. <strong>Process another video</strong> clears that selection; it does not delete the job. <strong>Download all</strong> remains visible beside the workspace title in every view.</p>\n<h3 id=\"visual-index-controls\">Visual-index controls</h3>\n<p>Ask and Create expose the same controls whenever safe Adversal frames exist:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Control</th><th>Behavior</th></tr></thead><tbody><tr><td>Build visual index</td><td>Describes frames without existing current captions using the selected backend</td></tr><tr><td>Rebuild visual index</td><td>Re-describes every frame after an index is complete</td></tr><tr><td>Use visual evidence in Ask and Create</td><td>Includes caption retrieval and actual frame pixels when enabled; leaves the manifest intact when disabled</td></tr></tbody></table></div>\n<p>Each successful caption is persisted immediately, so a failed or interrupted build can resume. A caption record includes the safe relative path, alt text, chapter, timestamp, content hash, caption, provider, and model. Missing, changed, or path-unsafe images are discarded when the manifest is loaded.</p>\n<h2 id=\"output-contracts\">Output contracts</h2>\n<h3 id=\"source-downloads\">Source downloads</h3>\n<ul><li><strong>Markdown:</strong> the completed job&#x27;s source notes.</li><li><strong>Native ZIP:</strong> notes plus referenced images whose resolved paths remain inside the job directory.</li><li><strong>OKF 0.2 ZIP:</strong> <code>index.md</code>, <code>video.md</code>, numbered chapter files under <code>chapters/</code>, and referenced images under <code>assets/</code>.</li><li><strong>Download all ZIP:</strong> the renamed Markdown, native ZIP, OKF ZIP, and generated documents already cached for the active request and selected backend. It does not generate missing documents.</li></ul>\n<p>The filename contract is <code>&lt;safe-original-stem&gt;<em>&lt;download-type&gt;.&lt;extension&gt;</code>. Spaces and unsafe separators in the source stem become underscores. Examples include <code>My</em>Lecture<em>notes.md</code>, <code>My</em>Lecture<em>native</em>bundle.zip</code>, <code>My<em>Lecture</em>okf<em>0</em>2<em>bundle.zip</code>, and <code>My</em>Lecture<em>all</em>downloads.zip</code>.</p>\n<p>The OKF index declares <code>okf_version: &quot;0.2&quot;</code>. Video and chapter concepts contain YAML frontmatter, source metadata, draft status, and generation metadata.</p>\n<h3 id=\"generated-documents\">Generated documents</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Output</th><th>Download filename</th></tr></thead><tbody><tr><td>Meeting/webinar summarizer</td><td><code>&lt;stem&gt;<em>meeting</em>summary.md</code></td></tr><tr><td>Content triage</td><td><code>&lt;stem&gt;<em>content</em>triage.md</code></td></tr><tr><td>Video to blog post</td><td><code>&lt;stem&gt;<em>blog</em>post.md</code></td></tr><tr><td>Quiz and flashcards</td><td><code>&lt;stem&gt;<em>quiz</em>flashcards.md</code></td></tr><tr><td>SOP/how-to guide</td><td><code>&lt;stem&gt;<em>sop</em>guide.md</code></td></tr><tr><td>Interview insight pack</td><td><code>&lt;stem&gt;<em>interview</em>insights.md</code></td></tr><tr><td>FAQ/help-center article</td><td><code>&lt;stem&gt;<em>faq</em>article.md</code></td></tr></tbody></table></div>\n<p>Each document starts after an explicit Generate click and is cached by <code>(request<em>id, selected</em>backend, visual<em>evidence</em>hash)</code>. Source notes at or below 50,000 characters go directly to the final prompt. Longer notes are condensed in batches of at most 30,000 characters until they fit the final generation step.</p>\n<h2 id=\"qdrant-retrieval\">Qdrant retrieval</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Item</th><th>Contract</th></tr></thead><tbody><tr><td>Collection</td><td><code>video<em>chunks</em>text<em>embedding</em>3<em>small</em>v1</code></td></tr><tr><td>Distance</td><td>Cosine</td></tr><tr><td>Default result count</td><td>5 text chunks and 3 frames for Ask; up to 4 frames for Create</td></tr><tr><td>Required filter</td><td>Payload <code>request_id</code> equals the active job</td></tr><tr><td>Point kinds</td><td><code>text</code> and caption-derived <code>frame</code> points in one embedding space</td></tr><tr><td>Point identity</td><td>Deterministic UUID derived from request ID, evidence hash, kind, and index</td></tr><tr><td>Idempotency</td><td>Matching request ID, notes hash, evidence hash, model, and point count skips re-indexing</td></tr></tbody></table></div>\n<p>Chunks are built from Adversal chapter separators and headings with a target maximum of 1,500 characters. Payloads include source, heading, approximate timestamp, text, chunk index, notes hash, evidence hash, kind, optional safe image path, and embedding model. Frame captions persist in each job&#x27;s <code>visual-evidence.json</code>.</p>\n<h2 id=\"local-storage\">Local storage</h2>\n<pre><code class=\"language-text\">runs/\n├── jobs.json\n├── qdrant/\n└── &lt;timestamp&gt;_&lt;uuid&gt;_&lt;video-slug&gt;/\n    ├── &lt;uploaded-video&gt;       # uploads only\n    ├── notes.md\n    ├── visual-evidence.json   # after visual indexing\n    ├── &lt;Adversal images&gt;\n    └── requested_frames/      # only when exact timestamps were requested</code></pre>\n<p><code>jobs.json</code> is updated through a process-local lock and atomic temporary-file replacement. Run data is unencrypted and has no automatic retention policy. Generated documents and chat history remain in Streamlit session state instead of being written to this tree.</p>\n<h2 id=\"logging\">Logging</h2>\n<p>Application events are written to the visible terminal and to <code>logs/video-summarizer.log</code>. The rotating file is limited to 5 MiB with three backups. Supported levels are <code>DEBUG</code>, <code>INFO</code>, <code>WARNING</code>, <code>ERROR</code>, and <code>CRITICAL</code>; an invalid value falls back to <code>INFO</code> and emits a warning.</p>\n<p>Logging setup is process-wide and idempotent across Streamlit reruns. Application logs record only operational metadata. Known provider-key values and common token formats are redacted, and handled failures omit exception messages that could contain remote or user content. Streamlit writes its own server messages directly to the terminal; uv and first-time launcher output are not copied into the application log file.</p>\n<h2 id=\"sidebar-controls\">Sidebar controls</h2>\n<ul><li><strong>LLM backend:</strong> selects the chat provider.</li><li><strong>Quota:</strong> calls Adversal&#x27;s remaining-quota tool.</li><li><strong>Resume a previous job:</strong> shows the ten newest saved jobs.</li><li><strong>Danger zone:</strong> closes Qdrant and removes the complete <code>runs/</code> directory after confirmation.</li></ul>\n<h2 id=\"development-commands\">Development commands</h2>\n<pre><code class=\"language-bash\">uv sync --locked --all-groups\nuv run streamlit run app.py\nuv run pytest -q\nuv run ruff check .\nuv run ty check</code></pre>\n<p>CI runs dependency sync, Ruff, ty, and pytest on Windows for pushes and pull requests targeting <code>main</code>. The GitHub branch currently has no protection rule requiring that check before merge.</p>\n<h2 id=\"operating-limits\">Operating limits</h2>\n<ul><li>Designed for one trusted user and one Streamlit server process, either locally or in a private Docker Space.</li><li>Local OAuth opens on the server computer. In the private Space workflow, its temporary sign-in URL is read from runtime logs.</li><li>Local Qdrant storage must not be shared by multiple app processes.</li><li>No automatic retry, provider fallback, retention cleanup, or encryption is implemented.</li><li>A private Hugging Face Docker deployment workflow is checked in. Creating the Space requires a paid plan; public or multi-user deployment is unsupported.</li><li>Provider output and retrieval scores require human verification for important use.</li></ul>"}, {"slug": "docs-technicalguide", "title": "Video Summarizer technical guide", "category": "Operate", "description": "Developer and operator guidance for the complete runtime lifecycle.", "source": "docs/TECHNICAL_GUIDE.md", "content": "<h1 id=\"video-summarizer-technical-guide\">Video Summarizer technical guide</h1>\n<p>This guide is the starting point for developers and operators. It explains how the application is assembled, how data moves through it, which contracts must remain stable, and how to run and diagnose it safely.</p>\n<p>For end-user procedures, use the <a href=\"#docs-tutorial\">tutorial</a> or <a href=\"#docs-howto\">how-to guides</a>. For exhaustive option and model tables, use the <a href=\"#docs-reference\">reference</a>.</p>\n<h2 id=\"system-purpose-and-boundary\">System purpose and boundary</h2>\n<p>Video Summarizer processes one video through Adversal and reuses the resulting Markdown and key frames for nine workflows:</p>\n<ul><li>direct notes and frame review;</li><li>Qdrant-backed question answering;</li><li>meeting summary, content triage, and blog generation; and</li><li>quiz, SOP, interview-insight, and FAQ generation.</li></ul>\n<p>The supported runtime has one trusted user and one Streamlit server process. It can run on a local computer or in a private Hugging Face Docker Space. It is not a public, multi-user, or multi-process service.</p>\n<p><a href=\"./diagrams/video-summarizer-architecture.html\"><img src=\"./diagrams/system-architecture.svg\" alt=\"System architecture\" loading=\"lazy\"></a></p>\n<p>Detailed views:</p>\n<ul><li><a href=\"./diagrams/video-processing-sequence.svg\">video-processing sequence</a>;</li><li><a href=\"./diagrams/job-lifecycle.svg\">job lifecycle</a>; and</li><li><a href=\"./diagrams/private-space-deployment.html\">private Space deployment</a>.</li></ul>\n<h2 id=\"runtime-architecture\">Runtime architecture</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Layer</th><th>Module</th><th>Responsibility</th></tr></thead><tbody><tr><td>Presentation</td><td><code>app.py</code></td><td>Streamlit widgets, session routing, upload/URL submission, authentication UI, workspace selection</td></tr><tr><td>Workflow</td><td><code>pipeline.py</code></td><td>Job model, directory allocation, JSON persistence, polling, result loading</td></tr><tr><td>Video integration</td><td><code>adversal_client.py</code></td><td>Persistent serialized MCP stdio session with <code>adversal-cli</code></td></tr><tr><td>Artifact handling</td><td><code>artifacts.py</code></td><td>Safe image discovery, native ZIP, OKF 0.2 ZIP</td></tr><tr><td>Feature workflows</td><td><code>modes.py</code></td><td>Retrieval UI, prompts, long-note reduction, seven generated documents</td></tr><tr><td>Vector storage</td><td><code>vector_store.py</code></td><td>Embedded Qdrant collection, indexing, request-filtered search</td></tr><tr><td>Model integration</td><td><code>llm.py</code></td><td>OpenAI, Agnes, Gemini, and OpenAI embedding clients</td></tr><tr><td>Observability</td><td><code>observability.py</code></td><td>Terminal/file logging, rotation, levels, redaction</td></tr></tbody></table></div>\n<p>The modules are flat and organized by layer. Keep provider SDK construction inside <code>llm.py</code>, MCP transport inside <code>adversal<em>client.py</code>, vector ownership inside <code>vector</em>store.py</code>, and Streamlit routing inside <code>app.py</code>.</p>\n<h3 id=\"application-state-routing\">Application state routing</h3>\n<p><code>app.main()</code> derives the visible page from a small amount of session and job state:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Condition</th><th>Visible UI</th><th>Transition</th></tr></thead><tbody><tr><td><code>auth_required</code> is true</td><td>Authentication banner; normal page rendering stops</td><td>Successful OAuth clears the flag and reruns</td></tr><tr><td>No active job</td><td>Video source and analysis form</td><td>Successful submission stores the new active job</td></tr><tr><td>Active job is <code>RUNNING</code></td><td>Polling status panel</td><td>Terminal Adversal status is persisted and rerun</td></tr><tr><td>Active job is <code>FAILED</code></td><td>Error, <strong>Retry status check</strong>, and <strong>Start over</strong></td><td>Retry reuses the request ID; Start over clears only the active pointer</td></tr><tr><td>Active job is <code>COMPLETED</code></td><td>Notes, Key frames, Ask, and Create workspace</td><td><strong>Process another video</strong> clears only the active pointer</td></tr></tbody></table></div>\n<p>The sidebar is rendered for every normal page state. It selects the chat backend, checks quota, resumes one of the ten newest saved jobs, and exposes the destructive run-data control.</p>\n<h2 id=\"video-processing-lifecycle\">Video-processing lifecycle</h2>\n<ol><li><code>app.py</code> accepts exactly one uploaded video or public URL and creates a UUID-bearing directory under <code>runs/</code>.</li><li><code>pipeline.submit<em>job()</code> calls <code>adversal</em>client.process_video()</code> with the selected video type, frame density, and optional focused-processing values.</li><li>The process-wide MCP client lazily starts <code>adversal-cli</code>, keeps that session alive across Streamlit reruns, and returns a parsed <code>request_id</code>.</li><li>The application persists a <code>RUNNING</code> job in <code>runs/jobs.json</code>.</li><li>A Streamlit fragment calls <code>check<em>video</em>status</code> every eight seconds through the same serialized MCP session. A real application restart uses Adversal&#x27;s persisted registry.</li><li><code>COMPLETED</code> persists the completion time and exposes the workspace. <code>FAILED</code> persists the error. <code>UNKNOWN</code> becomes a recoverable failed state instead of polling forever.</li></ol>\n<p>Authentication follows a separate branch. An MCP response containing <code>AUTHENTICATION REQUIRED</code> becomes <code>AdversalAuthRequiredError</code>; the app presents an authentication control, calls the MCP <code>authenticate</code> tool, and reruns.</p>\n<p>Locally, <code>adversal-cli</code> opens the sign-in flow on the computer running Streamlit. In a private Hugging Face Space, <code>SPACE_ID</code> changes the instructions: the user opens the temporary URL printed in runtime logs, and the resulting Adversal state persists under <code>/data/adversal</code>.</p>\n<h2 id=\"job-contract\">Job contract</h2>\n<p><code>pipeline.Job</code> is both the in-memory record and the serialized <code>jobs.json</code> schema.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field</th><th>Type</th><th>Meaning</th></tr></thead><tbody><tr><td><code>mode</code></td><td>string</td><td>Submission mode retained for compatibility</td></tr><tr><td><code>request_id</code></td><td>string</td><td>Adversal request and persistence key</td></tr><tr><td><code>output_dir</code></td><td>string</td><td>Job-owned directory containing source and results</td></tr><tr><td><code>file_name</code></td><td>string</td><td>Markdown result name; default <code>notes.md</code></td></tr><tr><td><code>status</code></td><td>string</td><td><code>RUNNING</code>, <code>COMPLETED</code>, or <code>FAILED</code></td></tr><tr><td><code>error</code></td><td>string or null</td><td>Failure detail when available</td></tr><tr><td><code>submitted_at</code></td><td>number</td><td>Unix submission timestamp</td></tr><tr><td><code>source_name</code></td><td>string</td><td>User-facing source label</td></tr><tr><td><code>source_url</code></td><td>string or null</td><td>Original URL for URL submissions</td></tr><tr><td><code>video_type</code></td><td>string</td><td><code>generic</code>, <code>lesson</code>, <code>interview</code>, or <code>meeting</code></td></tr><tr><td><code>image_density</code></td><td>string</td><td><code>minimal</code>, <code>selective</code>, or <code>generous</code></td></tr><tr><td><code>start_time</code></td><td>string or null</td><td>Optional focused clip start</td></tr><tr><td><code>end_time</code></td><td>string or null</td><td>Optional focused clip end</td></tr><tr><td><code>timestamps</code></td><td>list of strings</td><td>Optional exact-frame timestamps</td></tr><tr><td><code>completed_at</code></td><td>number or null</td><td>Unix completion timestamp</td></tr></tbody></table></div>\n<p>Job updates use a process-local lock and atomic temporary-file replacement. This prevents partial JSON writes inside one process; it does not provide coordination among several application processes.</p>\n<h2 id=\"persistence-model\">Persistence model</h2>\n<p>Durable application state:</p>\n<pre><code class=\"language-text\">runs/\n├── jobs.json\n├── qdrant/\n└── &lt;timestamp&gt;_&lt;uuid&gt;_&lt;slug&gt;/\n    ├── &lt;uploaded-video&gt;       # upload submissions only\n    ├── notes.md\n    ├── visual-evidence.json   # resumable frame captions, when built\n    ├── &lt;referenced frames&gt;\n    └── requested_frames/      # exact timestamp frames, when requested</code></pre>\n<p>Streamlit session state holds the active job, generated-document caches, Ask chat history, and index-ready markers. Closing a browser session loses those interactive objects but not jobs, source artifacts, or Qdrant vectors.</p>\n<p>The private Docker deployment maps persistent bucket paths as follows:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Persistent path</th><th>Container path</th><th>Purpose</th></tr></thead><tbody><tr><td><code>/data/runs</code></td><td><code>/home/user/app/runs</code></td><td>Jobs, videos, Markdown, frames, Qdrant</td></tr><tr><td><code>/data/adversal</code></td><td><code>/home/user/.adversal</code></td><td>Adversal OAuth session and local registry</td></tr><tr><td><code>/data/logs</code></td><td><code>/home/user/app/logs</code></td><td>Rotating application logs</td></tr></tbody></table></div>\n<h2 id=\"adversal-integration\">Adversal integration</h2>\n<p><code>adversal_client.py</code> exposes four synchronous wrappers over asynchronous MCP calls:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Function</th><th>MCP tool</th><th>Contract</th></tr></thead><tbody><tr><td><code>process_video()</code></td><td><code>process_video</code></td><td>Accept exactly one of <code>video<em>path</code> or <code>video</em>url</code></td></tr><tr><td><code>check<em>video</em>status()</code></td><td><code>check<em>video</em>status</code></td><td>Return status for one <code>request_id</code></td></tr><tr><td><code>check<em>remaining</em>quota()</code></td><td><code>check<em>remaining</em>quota</code></td><td>Return account quota information</td></tr><tr><td><code>authenticate()</code></td><td><code>authenticate</code></td><td>Complete browser-based OAuth</td></tr></tbody></table></div>\n<p>The first wrapper call lazily starts <code>adversal-cli</code>; later calls reuse the same serialized MCP session until the application exits or the transport fails. Each tool response is validated against its success contract. Tool errors become <code>AdversalError</code>, while authentication requirements use the dedicated <code>AdversalAuthRequiredError</code> type.</p>\n<p><code><em>MCPConnection</code> owns one daemon worker thread. A single coroutine on that thread enters and exits the MCP stdio and client-session contexts, while synchronous Streamlit callers submit <code></em>ToolCall</code> records through a thread-safe queue and wait on futures. This avoids cross-task AnyIO cancellation-scope errors and keeps Adversal&#x27;s background extraction task alive between Streamlit reruns. Calls remain serialized by the adapter lock.</p>\n<p>The adapter validates these response contracts before returning data upstream:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Tool</th><th>Required successful response</th></tr></thead><tbody><tr><td><code>process_video</code></td><td>Contains a parseable <code>request_id</code>; otherwise the original Adversal message becomes <code>AdversalError</code></td></tr><tr><td><code>check<em>video</em>status</code></td><td>Begins with <code>COMPLETED</code>, <code>FAILED</code>, <code>RUNNING</code>, or <code>UNKNOWN</code></td></tr><tr><td><code>check<em>remaining</em>quota</code></td><td>Begins with <code>QUOTA STATUS</code></td></tr><tr><td><code>authenticate</code></td><td>Begins with <code>AUTHENTICATED</code>; <code>AUTHENTICATION FAILED</code> remains an error</td></tr></tbody></table></div>\n<p>A transport exception closes and discards the connection. The next user action creates a new session. The adapter never automatically retries <code>process_video</code>, so an uncertain submission cannot silently create a duplicate remote job.</p>\n<h2 id=\"artifacts-and-exports\">Artifacts and exports</h2>\n<p>The completed <code>notes.md</code> and its referenced frames are the authoritative artifacts. Derived LLM documents never replace them.</p>\n<p>Available exports:</p>\n<ul><li>Markdown only;</li><li>native ZIP containing Markdown and referenced local images; and</li><li>OKF 0.2 ZIP containing an index, video concept, chapter concepts, and assets; and</li><li>a deferred Download all ZIP containing those core downloads plus generated documents already cached for the active request and selected backend.</li></ul>\n<p>Browser filenames follow <code>&lt;safe-original-stem&gt;_&lt;download-type&gt;.&lt;extension&gt;</code>. Download all never generates a missing document or invokes an LLM; the native and OKF archives remain nested so their established internal layouts do not change.</p>\n<p>Uploaded filenames are reduced to a basename and checked against the job directory. Markdown image paths are resolved relative to the job directory and rejected if they escape it. Preserve both checks when changing upload, rendering, or export behavior.</p>\n<h2 id=\"retrieval-architecture\">Retrieval architecture</h2>\n<p>Ask uses an embedded Qdrant client with one shared collection: <code>video<em>chunks</em>text<em>embedding</em>3<em>small</em>v1</code>.</p>\n<p>The indexing pipeline:</p>\n<ol><li>split notes along Adversal chapter separators and headings;</li><li>create chunks targeting at most 1,500 characters;</li><li>load resumable frame descriptions from <code>visual-evidence.json</code> when available;</li><li>embed text chunks and frame descriptions with OpenAI <code>text-embedding-3-small</code>;</li><li>write deterministic <code>text</code> and <code>frame</code> points with request, evidence, timestamp, safe image path, notes hash, and embedding-model metadata; and</li><li>retrieve five text chunks plus three frames for Ask, or four frames for Create, with a mandatory active <code>request_id</code> filter.</li></ol>\n<p>Matching request ID, notes hash, visual-evidence hash, embedding model, and point count makes indexing idempotent. If notes or frame captions change, only that video&#x27;s points are replaced.</p>\n<p>The selected chat provider does not change the embedding model. Mixing embedding spaces inside the same collection would invalidate similarity comparisons.</p>\n<h2 id=\"generated-document-pipeline\">Generated-document pipeline</h2>\n<p><code>modes.py</code> owns seven LLM-generated outputs. Generation starts only on an explicit user click. Each result is cached using <code>(request<em>id, selected</em>backend, visual<em>evidence</em>hash)</code> so reruns do not repeat paid calls or reuse stale visual context.</p>\n<p>Notes up to 50,000 characters go directly to final generation. Longer notes are reduced in batches of at most 30,000 characters until they fit. Image-oriented outputs preserve supported Markdown image references through reduction.</p>\n<p>The Notes and Key frames views do not invoke a model. <strong>Build visual index</strong> explicitly describes every safe frame using the selected backend and persists each success. Ask retrieves five text chunks and three frames, then supplies those pixels to the selected backend. Create retrieves up to four frames and supplies their pixels for every workflow. Provider image-input failures are surfaced without removing text-only functionality.</p>\n<h2 id=\"model-configuration\">Model configuration</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Backend</th><th>Model</th><th>Reasoning configuration</th></tr></thead><tbody><tr><td>OpenAI</td><td><code>gpt-5.6-luna</code></td><td>medium reasoning effort</td></tr><tr><td>Agnes AI</td><td><code>agnes-2.5-flash</code></td><td>provider default</td></tr><tr><td>Google</td><td><code>gemini-3.5-flash-lite</code></td><td>medium thinking</td></tr><tr><td>Google</td><td><code>gemini-3.7-flash</code></td><td>medium thinking</td></tr></tbody></table></div>\n<p>Environment variables:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Variable</th><th>Use</th></tr></thead><tbody><tr><td><code>OPENAI<em>API</em>KEY</code></td><td>OpenAI chat and all Ask embeddings</td></tr><tr><td><code>OPENAI<em>BASE</em>URL</code></td><td>Optional OpenAI-compatible gateway</td></tr><tr><td><code>AGNES<em>API</em>KEY</code></td><td>Agnes chat</td></tr><tr><td><code>GOOGLE<em>API</em>KEY</code></td><td>Gemini chat</td></tr><tr><td><code>VIDEO<em>SUMMARIZER</em>LOG_LEVEL</code></td><td><code>DEBUG</code>, <code>INFO</code>, <code>WARNING</code>, <code>ERROR</code>, or <code>CRITICAL</code></td></tr><tr><td><code>VIDEO<em>SUMMARIZER</em>DATA_DIR</code></td><td>Container persistent-data root; defaults to <code>/data</code></td></tr></tbody></table></div>\n<p><code>.env</code> is an optional local fallback. <code>python-dotenv</code> uses <code>override=False</code>, so inherited environment variables take precedence. Never commit <code>.env</code> or place secrets in Space variables that are visible rather than secret.</p>\n<h2 id=\"observability\">Observability</h2>\n<p><code>observability.configure_logging()</code> runs once per process despite Streamlit reruns. It writes to stdout and <code>logs/video-summarizer.log</code>, rotates at 5 MiB, and keeps three backups. An invalid level falls back to <code>INFO</code> and produces a warning.</p>\n<p>Application events include operation names, component names, request IDs, selected models, counts, durations, states, and error types. They omit prompts, transcripts, generated text, filenames, URLs, exception messages, and secret values. Known provider keys and common token formats are redacted by the logging filter.</p>\n<p>For local diagnosis, keep the <code>launch.cmd</code> terminal open and inspect the rotating file. Set <code>VIDEO<em>SUMMARIZER</em>LOG_LEVEL=DEBUG</code> only when stack-frame locations are required.</p>\n<h2 id=\"deployment\">Deployment</h2>\n<h3 id=\"local-windows-runtime\">Local Windows runtime</h3>\n<pre><code class=\"language-bat\">launch.cmd</code></pre>\n<p>The launcher installs uv when absent, installs Python 3.13.13, creates <code>.venv</code>, performs a locked dependency sync, creates <code>.env</code> when missing, checks FFmpeg tools, and starts Streamlit from the project virtual environment.</p>\n<h3 id=\"manual-development-runtime\">Manual development runtime</h3>\n<pre><code class=\"language-powershell\">uv python pin 3.13.13\nuv sync --locked --all-groups\nuv run streamlit run app.py</code></pre>\n<h3 id=\"private-hugging-face-runtime\">Private Hugging Face runtime</h3>\n<p><code>Dockerfile</code> builds a Python 3.13 image with uv and FFmpeg, runs as UID 1000, and starts Streamlit on port 7860. <code>container-entrypoint.sh</code> maps the persistent data root before launching the command; <code>VIDEO<em>SUMMARIZER</em>DATA_DIR</code> can override its <code>/data</code> default.</p>\n<p>The target Space must remain private because all visitors would otherwise share one Adversal identity, job history, Qdrant collection, uploaded data, and destructive clear control. Creating a Docker Space requires a paid Hugging Face plan.</p>\n<h2 id=\"security-model\">Security model</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Boundary</th><th>Current control</th><th>Residual risk</th></tr></thead><tbody><tr><td>Uploaded filename</td><td>Basename extraction and resolved-path containment</td><td>Uploaded content itself remains untrusted</td></tr><tr><td>Markdown images</td><td>Job-directory containment before serving or archiving</td><td>Malicious Markdown may contain unsupported external references</td></tr><tr><td>Provider credentials</td><td>Environment/secret storage and log redaction</td><td>Host or Space administrators can access runtime secrets</td></tr><tr><td>Persistent data</td><td>Private local directory or private bucket</td><td>Data is unencrypted by the application and retained indefinitely</td></tr><tr><td>Public video URL</td><td>Trusted single-user boundary</td><td>No application-level scheme, host, or private-network policy</td></tr><tr><td>Qdrant</td><td>Mandatory active-request filter</td><td>Embedded storage is not safe for multiple processes</td></tr></tbody></table></div>\n<p>Do not expose this application publicly without adding user authentication, tenant isolation, URL/network policy, encrypted storage, retention rules, transactional job coordination, and Qdrant Server or Cloud.</p>\n<h2 id=\"development-and-verification\">Development and verification</h2>\n<p>Run the complete local quality gate:</p>\n<pre><code class=\"language-powershell\">uv sync --locked --all-groups\nuv run ruff check .\nuv run ty check\nuv run pytest -q</code></pre>\n<p>The tests cover Adversal response parsing and connection reuse, focused-job backward compatibility, requested-frame containment, upload and Markdown image containment, bundle safety, provider contracts, cache keys, long-note reduction, Qdrant filtering/idempotency, concurrent persistence, and logging behavior. External Adversal and model services are not called by the test suite.</p>\n<p>CI runs the same dependency sync, Ruff, ty, and pytest checks on Windows for pushes and pull requests targeting <code>main</code>.</p>\n<h3 id=\"build-the-offline-documentation-site\">Build the offline documentation site</h3>\n<p><code>scripts/build<em>docs</em>site.py</code> reads every tracked Markdown file and generates <code>docs/site.html</code>. The result is a self-contained hash-routed site, so it can be opened directly from a file browser without a web server or JavaScript package install.</p>\n<pre><code class=\"language-bash\">uv run python scripts/build_docs_site.py\nuv run python scripts/build_docs_site.py --check</code></pre>\n<p>Run the first command after changing any Markdown page. The second command is a read-only synchronization check and should pass before committing documentation work.</p>\n<h3 id=\"runtime-invariants-to-preserve\">Runtime invariants to preserve</h3>\n<ul><li>Every rendered or archived local image must resolve inside its owning job directory.</li><li>Every Qdrant query must include the active <code>request_id</code> payload filter.</li><li>Embedding-model changes require a new compatible collection identity.</li><li>Paid generated documents must remain cached by request ID, selected backend, and visual-evidence hash.</li><li>MCP async contexts must be entered and exited by the same worker coroutine.</li><li><code>process_video</code> must never be retried automatically after an uncertain transport error.</li><li>Streamlit reruns must not add duplicate logging handlers.</li><li>Clearing runs must close the embedded Qdrant client before removing <code>runs/</code>.</li></ul>\n<h2 id=\"change-guide\">Change guide</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Change</th><th>Primary file</th><th>Required verification</th></tr></thead><tbody><tr><td>Add a generated output</td><td><code>modes.py</code></td><td>Registry/config parity, cache behavior, Markdown download</td></tr><tr><td>Add or change a model</td><td><code>llm.py</code></td><td>Fixed model ID, credential contract, reasoning option tests</td></tr><tr><td>Change Adversal arguments</td><td><code>adversal_client.py</code>, <code>app.py</code></td><td>MCP payload, auth/error translation, persisted settings</td></tr><tr><td>Change job fields or states</td><td><code>pipeline.py</code></td><td>Backward-compatible JSON loading, atomic persistence, resume UI</td></tr><tr><td>Change chunking or embeddings</td><td><code>modes.py</code>, <code>vector_store.py</code>, <code>llm.py</code></td><td>Collection compatibility, idempotency, active-video filter</td></tr><tr><td>Change upload/export behavior</td><td><code>app.py</code>, <code>artifacts.py</code>, <code>pipeline.py</code></td><td>Path-containment regressions</td></tr><tr><td>Change logging</td><td><code>observability.py</code></td><td>Idempotency, rotation, redaction, content-omission tests</td></tr><tr><td>Change hosted storage</td><td><code>Dockerfile</code>, <code>container-entrypoint.sh</code></td><td>Container start, ownership, symlinks, restart persistence</td></tr></tbody></table></div>\n<p>Keep changes at the owning layer and update the <a href=\"#docs-reference\">reference</a> whenever a public option, default, environment variable, storage path, or runtime behavior changes.</p>\n<h2 id=\"troubleshooting-map\">Troubleshooting map</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Symptom</th><th>First check</th><th>Next action</th></tr></thead><tbody><tr><td><code>adversal-cli not found</code></td><td><code>uv sync --locked --all-groups</code> completed</td><td>Confirm <code>.venv</code> and launcher environment</td></tr><tr><td>Authentication banner repeats</td><td>Runtime logs and persisted Adversal directory</td><td>Complete the newest OAuth URL; restart once</td></tr><tr><td>Authentication reports failure</td><td>Adversal message in the banner</td><td>Start a new browser flow; do not clear the auth state manually</td></tr><tr><td>Status becomes unknown or transport fails</td><td>Existing request ID and failed-job message</td><td>Select <strong>Retry status check</strong>; do not resubmit first</td></tr><tr><td>URL processing times out</td><td>Source is public and short enough for remote download</td><td>Upload an authorized local file instead</td></tr><tr><td>Ask cannot start</td><td><code>OPENAI<em>API</em>KEY</code> exists in the running process</td><td>Restart after setting the variable</td></tr><tr><td>Saved job cannot render</td><td>Job directory and <code>notes.md</code> still exist</td><td>Restore files or remove the stale job record manually</td></tr><tr><td>Repeated paid generation</td><td>Cache key changes with request or backend</td><td>Keep the same job/backend; inspect session resets</td></tr><tr><td>Qdrant errors after copying data</td><td>Only one process owns the storage path</td><td>Stop other processes; rebuild <code>runs/qdrant</code> if necessary</td></tr><tr><td>Missing hosted history after restart</td><td><code>/data</code> mappings are active</td><td>Inspect entrypoint output, mount, and permissions</td></tr></tbody></table></div>\n<p>For exact recovery procedures, continue with <a href=\"#docs-howto/recover-from-common-failures\">Recover from common failures</a>.</p>"}, {"slug": "docs-tutorial", "title": "Tutorial: process your first video", "category": "Learn", "description": "A guided first run from installation to a grounded answer and export.", "source": "docs/TUTORIAL.md", "content": "<h1 id=\"tutorial-process-your-first-video\">Tutorial: process your first video</h1>\n<p>Follow this tutorial from a fresh checkout to a completed video workspace. You will process one video with Adversal, inspect its notes and frames, ask a question with source excerpts, and create a document you can download.</p>\n<h2 id=\"what-you-will-build\">What you will build</h2>\n<p>By the end, one source video will provide:</p>\n<ul><li>chaptered Markdown notes and referenced screenshots;</li><li>a persistent Qdrant search index;</li><li>a grounded answer with chapter sources; and</li><li>an LLM-generated document such as a quiz or meeting summary.</li></ul>\n<p>The app processes the video once. Each later view reuses that Adversal result.</p>\n<p>This walkthrough keeps the default analysis settings. Use a short, non-sensitive video whose contents you can verify.</p>\n<h2 id=\"before-you-begin\">Before you begin</h2>\n<p>You need:</p>\n<ul><li>Windows 11 for the guided <code>launch.cmd</code> path;</li><li><code>ffmpeg</code> and <code>ffprobe</code> available on <code>PATH</code>;</li><li>an Adversal account; and</li><li>an <code>OPENAI<em>API</em>KEY</code> for the Ask exercise and default OpenAI backend.</li></ul>\n<p>Agnes AI and Gemini are optional alternatives for generated text. They do not replace the OpenAI embeddings used by Ask.</p>\n<p>Before continuing, verify the media tools in PowerShell:</p>\n<pre><code class=\"language-powershell\">ffmpeg -version\nffprobe -version</code></pre>\n<p>Each command should print version information.</p>\n<h2 id=\"1-start-the-application\">1. Start the application</h2>\n<p>From the repository root, run:</p>\n<pre><code class=\"language-bat\">launch.cmd</code></pre>\n<p>On its first run, the launcher installs <code>uv</code> when necessary, installs Python 3.13.13, creates <code>.venv</code>, synchronizes the locked dependencies, and creates <code>.env</code> from <code>.env.example</code> when missing.</p>\n<p>Open <code>.env</code> and add your key:</p>\n<pre><code class=\"language-dotenv\">OPENAI_API_KEY=your-key-here</code></pre>\n<p>Never commit <code>.env</code>. Restart <code>launch.cmd</code> after changing it, then open the Streamlit address shown in the terminal, normally <code>http://localhost:8501</code>.</p>\n<p><strong>Checkpoint:</strong> the page title is <strong>Video Summarizer</strong>, and the sidebar contains <strong>LLM backend</strong>, <strong>Quota</strong>, and <strong>Danger zone</strong>.</p>\n<h2 id=\"2-submit-a-video\">2. Submit a video</h2>\n<ol><li>Keep <strong>OpenAI - GPT-5.6 Luna</strong> selected in the sidebar.</li><li>Select <strong>Upload file</strong>.</li><li>Choose an <code>.mp4</code>, <code>.mov</code>, <code>.mkv</code>, or <code>.webm</code> video that you are authorized to process.</li><li>Keep <strong>Generic</strong> as the video type and <strong>Selective</strong> as the key-frame density.</li><li>Leave <strong>Advanced processing controls</strong> empty for this first full-video run.</li><li>Select <strong>Process video</strong>.</li></ol>\n<p>If Adversal requests authentication, select <strong>Authenticate</strong> and complete the browser flow on the same computer that runs Streamlit. The app resumes after the sign-in flow.</p>\n<p>The status panel checks Adversal every eight seconds through one persistent local MCP session. You can close the browser and resume the saved request later from the sidebar because its job record is stored in <code>runs/jobs.json</code>.</p>\n<p>If authentication fails, the banner remains visible and shows Adversal&#x27;s message. Start the browser flow again; the app does not treat a failed sign-in as success.</p>\n<p><strong>Checkpoint:</strong> while analysis is active, the page shows <code>RUNNING</code> and a last-checked time. When it finishes, the workspace opens on <strong>Notes</strong> and shows the Adversal request ID, analysis profile, and frame density.</p>\n<h2 id=\"3-inspect-the-source-artifacts\">3. Inspect the source artifacts</h2>\n<p>When processing completes, the <strong>Notes</strong> view opens.</p>\n<ol><li>Review the section and key-frame counts.</li><li>Scroll through the chaptered Markdown.</li><li>Open <strong>Key frames</strong> and inspect the extracted screenshots.</li><li>Return to <strong>Notes</strong> and download the Markdown or one of the ZIP bundles.</li><li>Select <strong>Download all</strong> beside the workspace title to collect all three source downloads in one ZIP.</li></ol>\n<p>The native bundle contains <code>notes.md</code> and only the local images referenced by those notes. The OKF 0.2 bundle reorganizes the same material into a video concept, chapter concepts, and assets suitable for agent ingestion.</p>\n<p><strong>Checkpoint:</strong> the section and key-frame metrics match the visible source artifacts. If Key frames is empty, continue with the notes; the selected source may not contain useful visual changes.</p>\n<h2 id=\"4-ask-a-grounded-question\">4. Ask a grounded question</h2>\n<ol><li>Open <strong>Ask</strong>.</li><li>Select <strong>Build visual index</strong>. The selected backend describes each frame and saves every successful caption, so interrupted work can resume.</li><li>Wait while the app builds the searchable text-and-frame index.</li><li>Ask a question whose answer appears in the video, such as:</li></ol>\n<pre><code class=\"language-text\">   What are the three main recommendations in this video?</code></pre>\n<ol><li>Expand <strong>Sources</strong> under the answer to inspect text citations and frame thumbnails.</li></ol>\n<p>The app embeds chapter-aware chunks and frame descriptions, retrieves five text chunks and up to three frames, then sends the retrieved frame pixels to the selected model. A similarity score is not proof, so verify important answers against the notes or video.</p>\n<p><strong>Checkpoint:</strong> the answer includes chapter-based grounding, and <strong>Sources</strong> lists up to five text headings plus three frame thumbnails with timestamps, captions, and similarity scores when available.</p>\n<h2 id=\"5-create-a-reusable-document\">5. Create a reusable document</h2>\n<ol><li>Open <strong>Create</strong>. It shares the same visual index with Ask.</li><li>Select <strong>Quiz and flashcards</strong> or another output.</li><li>Select <strong>Generate</strong> to start the paid model call. Up to four relevant frame pixels accompany the notes when a visual index exists.</li><li>Review the generated Markdown and its source-notes expander.</li><li>Select <strong>Download as Markdown</strong>.</li><li>Select <strong>Download all</strong>. The ZIP now includes this cached document without another model call.</li></ol>\n<p>The app caches the document by request ID, selected backend, and visual-evidence hash. Switching backends or rebuilding visual evidence creates another version without processing the video again.</p>\n<p>For the quiz workflow, confirm that the document contains ten questions, a separate answer key, and fifteen flashcards. Those counts are part of the workflow contract.</p>\n<h2 id=\"6-finish-safely\">6. Finish safely</h2>\n<p>Select <strong>Process another video</strong> to leave the current workspace without deleting its files. To remove all local videos, notes, history, and Qdrant data, use <strong>Danger zone</strong> in the sidebar and confirm <strong>Clear all runs</strong>.</p>\n<p>For focused operational tasks, continue with <a href=\"#docs-howto\">How-to guides</a>. For exact settings and contracts, see the <a href=\"#docs-reference\">Reference</a>. Developers and operators can continue with the <a href=\"#docs-technicalguide\">technical guide</a>.</p>"}, {"slug": "docs-usage", "title": "Using Video Summarizer", "category": "Documentation", "description": "Read Using Video Summarizer in the project documentation set.", "source": "docs/USAGE.md", "content": "<h1 id=\"using-video-summarizer\">Using Video Summarizer</h1>\n<p>The user documentation now follows the Diátaxis structure. Choose the page that matches what you need:</p>\n<ul><li><a href=\"#docs-tutorial\">Tutorial: process your first video</a>: learn the complete workflow by completing one guided example.</li><li><a href=\"#docs-howto\">How-to guides</a>: start the app, configure providers, process sources, build or disable the visual index, search text and frames, export individual artifacts or Download All, resume work, troubleshoot, and delete local data. It also covers focused clip ranges, exact frame timestamps, and retrying an existing Adversal request without resubmission.</li><li><a href=\"#docs-reference\">Reference</a>: look up supported inputs, exact options, models, environment variables, download-filename and archive contracts, storage, and commands.</li><li><a href=\"#docs-explanation\">Explanation</a>: understand the process-once architecture, Adversal MCP boundary, multimodal Qdrant retrieval, persistence, and security tradeoffs.</li></ul>\n<p>For implementation-level onboarding, continue to the <a href=\"#docs-technicalguide\">technical guide</a> or the deeper <a href=\"#docs-codebase-architecture\">codebase documentation</a>.</p>\n<h2 id=\"open-the-offline-documentation-site\">Open the offline documentation site</h2>\n<p>The repository also includes <a href=\"./site.html\">interactive HTML docs</a>. Open that file directly in a browser for a searchable sidebar, a zero-to-mastery learning path, and every tracked Markdown page in one local site.</p>\n<p>After editing documentation, rebuild the site from the repository root:</p>\n<pre><code class=\"language-bash\">uv run python scripts/build_docs_site.py</code></pre>\n<p>Use <code>uv run python scripts/build<em>docs</em>site.py --check</code> in a quality check to catch a stale generated site.</p>"}, {"slug": "docs-codebase-architecture", "title": "Architecture", "category": "Codebase", "description": "Implementation layers, responsibilities, patterns, and risks.", "source": "docs/codebase/ARCHITECTURE.md", "content": "<h1 id=\"architecture\">Architecture</h1>\n<h2 id=\"core-sections-required\">Core Sections (Required)</h2>\n<h3 id=\"1-architectural-style\">1) Architectural Style</h3>\n<ul><li>Style: a small layered Streamlit application with adapters around external services.</li><li>Structure: UI orchestration (<code>app.py</code>) calls workflow and persistence (<code>pipeline.py</code>), artifact and export logic (<code>artifacts.py</code>), feature renderers (<code>modes.py</code>), Qdrant storage (<code>vector_store.py</code>), and integration adapters.</li><li>Constraints: one trusted user and one process; Streamlit reruns; multi-minute asynchronous Adversal jobs; file-backed resume support; one serialized process-wide MCP session; and an optional private Docker deployment with a persistent <code>/data</code> mount.</li></ul>\n<h3 id=\"2-system-flow\">2) System Flow</h3>\n<pre><code class=\"language-text\">Streamlit widget -&gt; local upload or public URL -&gt; adversal-cli over MCP stdio\n-&gt; Adversal background job -&gt; 8-second fragment polling -&gt; notes.md + images\n-&gt; one workspace -&gt; notes/frames/exports, Qdrant RAG, or selected LLM output</code></pre>\n<ol><li><code>app.py:main()</code> initializes one active workspace job, selects the chat backend, and dispatches current state.</li><li><code>app.py:render<em>submit</em>form()</code> stores an upload under <code>runs/&lt;job&gt;/</code> or passes a URL, then calls <code>pipeline.submit_job()</code>.</li><li><code>pipeline.submit<em>job()</code> calls <code>adversal</em>client.process_video()</code> through the process-wide worker queue, receives a parsed request ID, creates a <code>Job</code>, and persists it in <code>runs/jobs.json</code>.</li><li><code>pipeline.render<em>job</em>progress()</code> polls <code>check<em>video</em>status()</code> every 8 seconds through <code>st.fragment</code> and the same MCP session; terminal or unknown status is persisted and triggers rerender.</li><li>Completed jobs expose Notes, Key frames, Ask, and Create. <code>modes.CREATE_RENDERERS</code> selects one of seven generated outputs, and the workspace header packages core and already-cached outputs through Download All.</li><li>An explicit action captions safe frames and persists a resumable manifest. Ask embeds chapter chunks and frame descriptions, retrieves both from Qdrant, and sends relevant pixels to the selected model.</li><li><code>llm.chat()</code> dispatches grounded prompts to OpenAI, Agnes through the OpenAI-compatible client, or Gemini.</li></ol>\n<p>Authentication branch: an Adversal response containing <code>AUTHENTICATION REQUIRED</code> becomes <code>AdversalAuthRequiredError</code>; <code>app.py</code> sets session state, shows an authentication banner, invokes browser OAuth, and clears the banner only after an <code>AUTHENTICATED</code> response. An <code>AUTHENTICATION FAILED</code> response remains visible as an error.</p>\n<p>Failure branch: malformed success responses and ordinary-text backend failures become <code>AdversalError</code> with the original message. <code>UNKNOWN</code> becomes a persisted failed job; <strong>Retry status check</strong> resumes polling the same request ID and never submits the video again.</p>\n<h3 id=\"3-layer-module-responsibilities\">3) Layer/Module Responsibilities</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Layer or module</th><th>Owns</th><th>Must not own</th><th>Evidence</th></tr></thead><tbody><tr><td>Presentation/orchestration (<code>app.py</code>)</td><td>Widgets, active workspace routing, destructive-run confirmation</td><td>MCP protocol and provider SDK construction</td><td><code>app.py</code></td></tr><tr><td>Workflow/persistence (<code>pipeline.py</code>)</td><td><code>Job</code>, status polling, local JSON/file paths, common rendering</td><td>Mode-specific prompts and provider credentials</td><td><code>pipeline.py</code></td></tr><tr><td>Artifact layer (<code>artifacts.py</code>)</td><td>Safe frame resolution, portable filenames, native/OKF exports, and Download All packaging</td><td>UI state or remote service calls</td><td><code>artifacts.py</code></td></tr><tr><td>Visual-evidence layer (<code>visual_evidence.py</code>)</td><td>Safe frame discovery, resumable caption manifests, evidence hashes, and provider-ready image inputs</td><td>UI rendering or vector queries</td><td><code>visual_evidence.py</code></td></tr><tr><td>Feature layer (<code>modes.py</code>)</td><td>Prompts, chunking, RAG chat, generated-output UI, and active-backend cache discovery</td><td>Adversal transport</td><td><code>modes.py</code></td></tr><tr><td>Vector store (<code>vector_store.py</code>)</td><td>Qdrant text/frame points, indexing, payload filtering and retrieval</td><td>Chat generation or Streamlit UI</td><td><code>vector_store.py</code></td></tr><tr><td>Adversal adapter (<code>adversal_client.py</code>)</td><td>MCP subprocess/session, tool calls, tool-error translation</td><td>Streamlit rendering</td><td><code>adversal_client.py</code></td></tr><tr><td>LLM adapter (<code>llm.py</code>)</td><td>Environment-backed clients, model dispatch, embeddings</td><td>Job/session persistence</td><td><code>llm.py</code></td></tr><tr><td>Observability (<code>observability.py</code>)</td><td>Rerun-safe terminal/file logging, rotation, levels, and secret redaction</td><td>User content or secret persistence</td><td><code>observability.py</code></td></tr><tr><td>Container runtime (<code>Dockerfile</code>, <code>container-entrypoint.sh</code>)</td><td>Reproducible Space image and persistent path mapping</td><td>Multi-user coordination or application authentication</td><td>deployment files</td></tr></tbody></table></div>\n<h3 id=\"4-reused-patterns\">4) Reused Patterns</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Pattern</th><th>Where found</th><th>Why it exists</th></tr></thead><tbody><tr><td>Adapter</td><td><code>adversal_client.py</code>, <code>llm.py</code></td><td>Isolates MCP and multimodal provider SDK details from UI/features</td></tr><tr><td>Strategy table</td><td><code>llm.<em>DISPATCH</code>, <code>modes.CREATE</em>RENDERERS</code></td><td>Selects provider or output behavior without branching chains</td></tr><tr><td>Data transfer object</td><td><code>pipeline.Job</code>, <code>modes.Chunk</code>, <code>llm.LLMOption</code></td><td>Carries persisted job, retrieval and provider data</td></tr><tr><td>Streamlit session cache</td><td>Generated documents, index-ready markers and chats in <code>modes.py</code></td><td>Preserves generated state across reruns for one browser session</td></tr><tr><td>Persistent vector store</td><td><code>runs/qdrant/</code> through <code>vector_store.py</code></td><td>Reuses embeddings across sessions and filters retrieval by active request</td></tr><tr><td>File-backed registry</td><td><code>runs/jobs.json</code></td><td>Resumes Adversal jobs after app restart</td></tr><tr><td>Worker-owned async session</td><td><code>adversal<em>client.</em>MCPConnection</code></td><td>Keeps MCP context entry, calls, and exit on one coroutine while Streamlit calls a synchronous API</td></tr><tr><td>Deferred export composition</td><td><code>app.render<em>workspace()</code>, <code>artifacts.build</em>all<em>downloads</em>bundle()</code></td><td>Builds the aggregate ZIP only when clicked and makes no provider call</td></tr></tbody></table></div>\n<h3 id=\"5-known-architectural-risks\">5) Known Architectural Risks</h3>\n<ul><li><code>jobs.json</code> locking is process-local; multiple server processes would not share it.</li><li>Generated mode caches are session-local and disappear when the browser session ends.</li><li>Persistent Qdrant local mode supports this single process; multi-process deployment needs Qdrant Server or Cloud.</li><li>The private Docker target preserves state in one mounted bucket but does not isolate several users from each other.</li><li>The Windows <code>quality</code> workflow runs dependency sync, Ruff, ty, and pytest; non-Windows behavior is not covered by CI.</li></ul>\n<h3 id=\"6-evidence\">6) Evidence</h3>\n<ul><li><code>README.md</code></li><li><code>app.py</code></li><li><code>pipeline.py</code></li><li><code>modes.py</code></li><li><code>artifacts.py</code></li><li><code>vector_store.py</code></li><li><code>adversal_client.py</code></li><li><code>llm.py</code></li><li><code>observability.py</code></li><li><code>Dockerfile</code></li><li><code>container-entrypoint.sh</code></li><li><code>tests/test_regressions.py</code></li><li><code>.github/workflows/ci.yml</code></li></ul>"}, {"slug": "docs-codebase-concerns", "title": "Codebase Concerns", "category": "Codebase", "description": "Known concerns, boundaries, and maintenance risks.", "source": "docs/codebase/CONCERNS.md", "content": "<h1 id=\"codebase-concerns\">Codebase Concerns</h1>\n<h2 id=\"core-sections-required\">Core Sections (Required)</h2>\n<h3 id=\"1-top-risks-prioritized\">1) Top Risks (Prioritized)</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Severity</th><th>Concern</th><th>Evidence</th><th>Impact</th><th>Suggested action</th></tr></thead><tbody><tr><td>Medium</td><td>User-controlled public URL reaches downloader</td><td><code>app.py</code>, <code>adversal_client.py</code></td><td>The private hosted runtime could expose server-side network access</td><td>Add URL/network policy before enabling URL ingestion for untrusted users</td></tr><tr><td>Medium</td><td>Raw integration errors are displayed</td><td><code>app.py</code></td><td>Provider/tool details may reach UI</td><td>Add an error-redaction contract before shared deployment</td></tr><tr><td>Medium</td><td>Local Qdrant is single-process</td><td><code>vector_store.py</code></td><td>A second Streamlit process cannot safely share the embedded storage directory</td><td>Use Qdrant Server or Cloud before multi-process deployment</td></tr></tbody></table></div>\n<h3 id=\"2-technical-debt\">2) Technical Debt</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Debt item</th><th>Why it exists</th><th>Where</th><th>Risk if ignored</th><th>Suggested fix</th></tr></thead><tbody><tr><td>Partial exception handling</td><td>Adversal and main multimodal workflow errors are handled; file and Qdrant errors may still reach Streamlit</td><td><code>app.py</code>, <code>modes.py</code>, <code>vector_store.py</code></td><td>Raw failure pages for remaining paths</td><td>Catch remaining errors at their owning UI boundary with provider/job context</td></tr><tr><td>Runtime storage has manual cleanup only</td><td>Local and private-hosted workflows retain completed artifacts</td><td><code>runs/</code>, <code>/data/runs</code>, <code>app.py</code></td><td>Disk or bucket growth</td><td>Keep manual cleanup for one trusted user; define retention before broader use</td></tr></tbody></table></div>\n<h3 id=\"3-security-concerns\">3) Security Concerns</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Risk</th><th>OWASP category</th><th>Evidence</th><th>Current mitigation</th><th>Gap</th></tr></thead><tbody><tr><td>User-controlled public URL reaches downloader</td><td>A10 SSRF</td><td><code>app.py</code>, <code>adversal_client.py</code>, <code>uv.lock</code></td><td>Supported deployment is private and single-user</td><td>No scheme/host/network validation in this layer; downstream behavior is unverified</td></tr><tr><td>Raw integration errors shown in UI</td><td>A09 Security Logging and Monitoring Failures / information exposure</td><td><code>app.py</code> error handlers and <code>modes.py</code> provider calls</td><td>Keys are not logged by application code</td><td>Error-redaction contract is absent</td></tr></tbody></table></div>\n<h3 id=\"4-performance-and-scaling-concerns\">4) Performance and Scaling Concerns</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Concern</th><th>Evidence</th><th>Current symptom</th><th>Scaling risk</th><th>Suggested improvement</th></tr></thead><tbody><tr><td>Serialized process-wide MCP session</td><td><code>adversal<em>client.</em>MCPConnection</code>, <code><em>call</em>tool()</code></td><td>One worker thread and queue run one tool call at a time</td><td>A long tool or recovery call delays quota, authentication, and status actions behind it</td><td>Retain the single-user boundary; add bounded call timeouts or separate connection ownership only if measured latency requires it</td></tr><tr><td>Full JSON registry rewrite per status change</td><td><code>pipeline.py</code></td><td>O(number of jobs) write</td><td>Slower as history grows</td><td>Use a database only when measured scale requires it</td></tr><tr><td>Embedded Qdrant local mode</td><td><code>vector_store.py</code></td><td>Serialized in-process access</td><td>Not suitable for multiple app processes or large shared corpora</td><td>Move the same client API to Qdrant Server or Cloud when deployment scope changes</td></tr></tbody></table></div>\n<h3 id=\"5-fragile-high-churn-areas\">5) Fragile/High-Churn Areas</h3>\n<p>The repository history remains shallow and concentrated in a short development window, so churn counts are too volatile to distinguish stable from fragile areas reliably.</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Area</th><th>Why fragile</th><th>Churn signal</th><th>Safe change strategy</th></tr></thead><tbody><tr><td><code>app.py</code> + <code>pipeline.py</code></td><td>Upload, persistence, polling and filesystem boundaries cross modules</td><td>Low-confidence short history</td><td>Keep focused path/persistence regressions passing</td></tr><tr><td><code>modes.py</code></td><td>Seven renderers plus reduction, chunking, and RAG chat</td><td>Broad feature responsibility</td><td>Test pure generation/chunk functions and rerun behavior separately</td></tr><tr><td><code>adversal_client.py</code></td><td>One daemon thread owns the async MCP context while synchronous callers wait on queued futures</td><td>Integration boundary with limited live-test coverage</td><td>Preserve same-coroutine context ownership, serialized calls, reset-on-transport-failure behavior, and mocked response-contract tests</td></tr></tbody></table></div>\n<h3 id=\"6-confirmed-product-boundary\">6) Confirmed Product Boundary</h3>\n<p>The supported remote path is a private Hugging Face Docker Space for one trusted user. Public, protected-but-shared, and multi-process deployments remain unsupported because they would share Adversal identity, run data, Qdrant state, and destructive controls.</p>\n<h3 id=\"7-evidence\">7) Evidence</h3>\n<ul><li>repository scan output captured during documentation generation</li><li><code>git log --format=&#x27;%h %ad %s&#x27; --date=short -20</code></li><li><code>app.py</code></li><li><code>pipeline.py</code></li><li><code>modes.py</code></li><li><code>adversal_client.py</code></li><li><code>pyproject.toml</code></li><li><code>README.md</code></li><li><code>.github/workflows/ci.yml</code></li><li><code>Dockerfile</code></li><li><code>container-entrypoint.sh</code></li><li><code>observability.py</code></li></ul>"}, {"slug": "docs-codebase-conventions", "title": "Coding Conventions", "category": "Codebase", "description": "Coding, naming, testing, and documentation conventions.", "source": "docs/codebase/CONVENTIONS.md", "content": "<h1 id=\"coding-conventions\">Coding Conventions</h1>\n<h2 id=\"core-sections-required\">Core Sections (Required)</h2>\n<h3 id=\"1-naming-rules\">1) Naming Rules</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Item</th><th>Rule</th><th>Example</th><th>Evidence</th></tr></thead><tbody><tr><td>Files</td><td>Lowercase snake case</td><td><code>adversal_client.py</code></td><td>tracked Python files</td></tr><tr><td>Functions/methods</td><td>Snake case; leading underscore for module-private helpers</td><td><code><em>extract</em>status</code>, <code>render<em>submit</em>form</code></td><td><code>pipeline.py</code>, <code>app.py</code></td></tr><tr><td>Types/interfaces</td><td>Pascal case; dataclasses for plain records; <code>Literal</code> aliases for bounded strings</td><td><code>Job</code>, <code>Chunk</code>, <code>VideoType</code></td><td><code>pipeline.py</code>, <code>modes.py</code>, <code>adversal_client.py</code></td></tr><tr><td>Constants/env vars</td><td>Upper snake case</td><td><code>POLL<em>INTERVAL</em>SECONDS</code>, <code>OPENAI<em>API</em>KEY</code></td><td><code>pipeline.py</code>, <code>.env.example</code></td></tr><tr><td>Browser downloads</td><td>Safe source stem, underscore, output type, extension</td><td><code>My<em>Lecture</em>blog_post.md</code></td><td><code>artifacts.download_filename()</code></td></tr></tbody></table></div>\n<h3 id=\"2-formatting-and-linting\">2) Formatting and Linting</h3>\n<ul><li>Formatter/linter: Ruff configured in <code>pyproject.toml</code>; line length 100.</li><li>Lint selection: <code>ALL</code>, excluding docstrings, copyright notice, formatter-conflicting comma/string rules, and <code>PLR0913</code>.</li><li>Type checker: ty targets Python 3.13 through <code>[tool.ty.environment]</code>.</li><li>Current check result: <code>uv run ruff check .</code> and <code>uv run ty check</code> both passed on 2026-08-23.</li><li>Commands: <code>uv run ruff check .</code>, <code>uv run ruff format .</code>, <code>uv run ty check</code>.</li></ul>\n<h3 id=\"3-import-and-module-conventions\">3) Import and Module Conventions</h3>\n<ul><li>Imports follow standard-library, third-party, then project grouping as enforced by Ruff.</li><li>Root modules use absolute imports such as <code>import pipeline</code>; no relative imports or barrel modules exist.</li><li><code>from <strong>future</strong> import annotations</code> appears where deferred annotations are useful; <code>TYPE_CHECKING</code> guards type-only imports.</li><li>Public exports are implicit; no <code><strong>all</strong></code> policy exists.</li></ul>\n<h3 id=\"4-error-and-logging-conventions\">4) Error and Logging Conventions</h3>\n<ul><li>Integration layer: <code>AdversalAuthRequiredError</code> separates authentication from general <code>AdversalError</code>; invalid local argument combinations raise <code>ValueError</code>.</li><li>UI layer: expected Adversal errors are caught and displayed with <code>st.error</code>; authentication sets session state and reruns.</li><li>Visual-index, Ask, and Create provider failures are caught at their owning UI boundary and show recovery guidance without exposing prompts. Missing result files and Qdrant failures still propagate to Streamlit; malformed visual manifests are logged and ignored.</li><li>Logging: modules use child loggers from <code>observability.get_logger()</code> and metadata-only event names; setup is idempotent across Streamlit reruns.</li><li>Sensitive data: API keys are read from environment or gitignored <code>.env</code>. The logging filter redacts known key values and common token formats; handled failures record exception types without exception messages or user content.</li><li>Runtime verbosity uses <code>VIDEO<em>SUMMARIZER</em>LOG_LEVEL</code>; rotating logs use 5 MiB files with three backups. Metrics and tracing are not configured.</li></ul>\n<h3 id=\"5-testing-conventions\">5) Testing Conventions</h3>\n<ul><li>Tests live in <code>tests/</code> and use the <code>test_*.py</code> naming pattern.</li><li>Tests use plain <code>assert</code>, <code>tmp_path</code>, and <code>monkeypatch</code>; no shared <code>conftest.py</code> fixtures exist.</li><li>Regression tests name the behavior they protect, for example <code>test<em>upload</em>path<em>stays</em>inside<em>job</em>directory</code>.</li><li>Coverage expectation: <code>[TODO]</code> no coverage tool or threshold is configured.</li></ul>\n<h3 id=\"6-evidence\">6) Evidence</h3>\n<ul><li><code>pyproject.toml</code></li><li><code>app.py</code></li><li><code>pipeline.py</code></li><li><code>adversal_client.py</code></li><li><code>observability.py</code></li><li><code>tests/test_observability.py</code></li><li><code>tests/test_regressions.py</code></li><li><code>.env.example</code></li><li><code>uv run ruff check .</code></li><li><code>uv run ty check</code></li></ul>"}, {"slug": "docs-codebase-integrations", "title": "External Integrations", "category": "Codebase", "description": "External services, SDKs, persistence, and integration boundaries.", "source": "docs/codebase/INTEGRATIONS.md", "content": "<h1 id=\"external-integrations\">External Integrations</h1>\n<h2 id=\"core-sections-required\">Core Sections (Required)</h2>\n<h3 id=\"1-integration-inventory\">1) Integration Inventory</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>System</th><th>Type</th><th>Purpose</th><th>Auth model</th><th>Criticality</th><th>Evidence</th></tr></thead><tbody><tr><td>Adversal via <code>adversal-cli</code></td><td>One process-wide MCP stdio subprocess plus remote backend</td><td>Video analysis, screenshots, status, quota</td><td>Browser OAuth persisted by Adversal locally</td><td>High</td><td><code>adversal_client.py</code>, <code>README.md</code></td></tr><tr><td>OpenAI</td><td>HTTPS API through SDK</td><td>Chat and all knowledge-base embeddings</td><td><code>OPENAI<em>API</em>KEY</code>; optional <code>OPENAI<em>BASE</em>URL</code></td><td>Medium</td><td><code>llm.py</code>, <code>.env.example</code></td></tr><tr><td>Agnes AI</td><td>OpenAI-compatible HTTPS API</td><td>Optional chat backend</td><td><code>AGNES<em>API</em>KEY</code></td><td>Medium</td><td><code>llm.py</code></td></tr><tr><td>Google Gemini</td><td>HTTPS API through <code>google-genai</code></td><td>Optional chat backend</td><td><code>GOOGLE<em>API</em>KEY</code></td><td>Medium</td><td><code>llm.py</code></td></tr><tr><td>Qdrant Client</td><td>Embedded persistent vector database</td><td>Store and retrieve active-video text and frame-description points</td><td>Local filesystem; no credentials</td><td>Medium</td><td><code>vector_store.py</code></td></tr><tr><td>Public video sources</td><td>URL input consumed by Adversal/its <code>yt-dlp</code> dependency</td><td>Remote video ingestion</td><td>Source-dependent</td><td>High</td><td><code>app.py</code>, <code>README.md</code>, <code>uv.lock</code></td></tr><tr><td>Hugging Face Spaces and Buckets</td><td>Private Docker hosting and persistent mounted storage</td><td>Optional hosted runtime</td><td>Hugging Face account; provider keys configured as Space secrets</td><td>Optional</td><td><code>Dockerfile</code>, <code>container-entrypoint.sh</code>, <code>README.md</code></td></tr></tbody></table></div>\n<h3 id=\"2-data-stores\">2) Data Stores</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Store</th><th>Role</th><th>Access layer</th><th>Key risk</th><th>Evidence</th></tr></thead><tbody><tr><td><code>runs/jobs.json</code></td><td>Persistent request registry</td><td><code>pipeline.<em>load</em>all<em>jobs()</code>, <code></em>save_job()</code></td><td>Lock is process-local; malformed files still fail loading</td><td><code>pipeline.py</code></td></tr><tr><td><code>runs/&lt;job&gt;/</code></td><td>Uploaded video, <code>notes.md</code>, and extracted images</td><td><code>app.py</code>, <code>pipeline.Job</code>, <code>artifacts.py</code></td><td>Unbounded retention; data is stored unencrypted</td><td>source modules</td></tr><tr><td><code>&lt;job&gt;/visual-evidence.json</code></td><td>Resumable safe frame captions with provider/model provenance</td><td><code>visual<em>evidence.build</em>evidence()</code></td><td>Atomic replacement; content hashes invalidate changed frames</td><td><code>visual_evidence.py</code></td></tr><tr><td><code>runs/qdrant/</code></td><td>Shared local Qdrant collection with request-filtered text/frame points</td><td><code>vector<em>store.index</em>video()</code></td><td>Single-process local-mode lock; deleted by Clear all runs</td><td><code>vector_store.py</code></td></tr><tr><td>Streamlit session state</td><td>Active job, generated documents used by Download All, index-ready markers and chat history</td><td><code>app.py</code>, <code>modes.py</code></td><td>Lost on session expiry; separate from disk registry and Qdrant</td><td>source modules</td></tr><tr><td><code>/data</code> bucket mount</td><td>Hosted runs, Adversal OAuth state, and rotating logs</td><td><code>container-entrypoint.sh</code></td><td>One shared trust boundary; private single-user deployment only</td><td>deployment files</td></tr></tbody></table></div>\n<p>The application does not configure an external database, message queue, event bus, service mesh, or shared cache. <code>adversal_client.py</code> does use an in-process thread-safe queue to serialize MCP calls onto the coroutine that owns the stdio session.</p>\n<h3 id=\"3-secrets-and-credentials-handling\">3) Secrets and Credentials Handling</h3>\n<ul><li>Credential sources: process environment first; optional local <code>.env</code> loaded without overriding existing values.</li><li><code>.env</code> is gitignored and <code>.env.example</code> contains names only; no hardcoded secret values were found in tracked source.</li><li>Adversal credentials are owned by <code>adversal-cli</code> browser OAuth, not this application.</li><li>Rotation/lifecycle: <code>[TODO]</code> provider-key rotation and revocation procedures are not documented.</li></ul>\n<h3 id=\"4-reliability-and-failure-behavior\">4) Reliability and Failure Behavior</h3>\n<ul><li>Adversal tool responses are validated against per-tool success contracts; authentication has a dedicated recovery UI. Ordinary <code>{&quot;result&quot;: ...}</code> failure text therefore remains an Adversal error instead of becoming a misleading missing-request-ID error.</li><li>The first tool action starts one worker-owned MCP session. Later submission, status, quota, and authentication actions reuse it until application exit or transport failure.</li><li>No automatic retry, exponential backoff, timeout or circuit breaker is configured for Adversal or LLM calls. Failed jobs can manually retry a status check with the same request ID.</li><li>Adversal status is polled every 8 seconds until <code>COMPLETED</code> or <code>FAILED</code>; <code>UNKNOWN</code> becomes a failed state that can retry the same request ID.</li><li>No fallback provider is selected automatically when an LLM call fails.</li><li>All seven generated documents are cached by request ID, selected backend, and visual-evidence hash in session state. Long-note reduction may make multiple sequential LLM calls before final generation.</li><li>Download All reads the active backend&#x27;s existing cache entries and packages them with the three core downloads; it never invokes a provider or generates a missing document.</li></ul>\n<h3 id=\"5-observability-for-integrations\">5) Observability for Integrations</h3>\n<ul><li>UI shows Adversal status and last-check time; expected tool errors are displayed.</li><li>Application events go to the terminal and a rotating file with component names, request IDs where applicable, timing, statuses, and error types.</li><li>Log filtering omits user content and redacts configured provider keys and common token forms. Metrics, distributed traces, cost counters, and health endpoints do not exist.</li><li>Visual indexing, Ask answers, and Create generation surface provider-labelled recovery guidance. Other provider failures still rely on the owning Streamlit context.</li><li>The application records wrapper lifecycle, timing, status, and error-type events, but it does not retain a separate structured archive of raw MCP subprocess diagnostics.</li></ul>\n<h3 id=\"6-evidence\">6) Evidence</h3>\n<ul><li><code>adversal_client.py</code></li><li><code>llm.py</code></li><li><code>pipeline.py</code></li><li><code>modes.py</code></li><li><code>.env.example</code></li><li><code>README.md</code></li><li><code>uv.lock</code></li><li><code>observability.py</code></li><li><code>Dockerfile</code></li><li><code>container-entrypoint.sh</code></li></ul>"}, {"slug": "docs-codebase-stack", "title": "Technology Stack", "category": "Codebase", "description": "The runtime, dependency, deployment, and quality-tool stack.", "source": "docs/codebase/STACK.md", "content": "<h1 id=\"technology-stack\">Technology Stack</h1>\n<h2 id=\"core-sections-required\">Core Sections (Required)</h2>\n<h3 id=\"1-runtime-summary\">1) Runtime Summary</

<title id="video-summarizer-architecture-title">Video Summarizer Architecture</title>
<desc id="video-summarizer-architecture-desc">A trusted single-user Streamlit process runs locally or in a private Docker Space, sends video to Adversal, persists artifacts, vectors, authentication, and logs, then reuses the result for search and generated documents.</desc>

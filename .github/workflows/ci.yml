# CI workflow definition for Video Summarizer.
# Responsible for running quality gates (linting, docs site sync check, type checking, unit tests)
# on Windows runner matching target deployment.
# Must not mutate repository state or deploy artifacts.
# Next: pyproject.toml for tool configuration or scripts/build_docs_site.py.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check documentation site
        run: uv run python scripts/build_docs_site.py --check

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest -q
